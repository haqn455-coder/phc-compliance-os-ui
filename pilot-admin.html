<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHC OS Pilot Admin</title><style>:root{--nav:#0b3558;--blue:#1467a5;--bg:#eef3f8;--line:#dce5ee;--mut:#66788d;--green:#e9f8f0;--amber:#fff6df;--red:#fff0ef}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui;background:var(--bg);color:#102338}.w{max-width:1180px;margin:auto;padding:14px}.top{background:linear-gradient(135deg,var(--nav),var(--blue));color:#fff;border-radius:20px;padding:18px;display:flex;gap:12px;align-items:flex-start}.top button{margin-left:auto}.c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.mut{color:var(--mut)}.btn{border:0;border-radius:9px;padding:9px 11px;background:var(--nav);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eaf1f7;color:#102338}.btn.green{background:#118a7e}.btn.red{background:#a64242}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf2f7;font-size:12px;font-weight:800}.tag.ACTIVE,.tag.VERIFIED{background:var(--green);color:#0a745e}.tag.PROVISIONED,.tag.APPROVED{background:var(--amber);color:#8a6414}.tag.REJECTED,.tag.SUSPENDED{background:var(--red);color:#9c3c3c}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.req{border-top:1px solid var(--line);padding:12px 0}.req:first-child{border-top:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field input{width:100%;padding:9px;border:1px solid #cdd8e3;border-radius:9px}.ver{margin-top:8px;background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:9px}.ok{color:#08745f}.bad{color:#9c3c3c}.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#102338;color:#fff;padding:10px 13px;border-radius:10px;display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.w{padding:8px}}</style></head><body><main class=w><section class=top><div><h1 style="margin:0">Pilot Onboarding Console</h1><div style="opacity:.85">Approve → Provision → Verify → Activate</div></div><button id=out class="btn secondary">Sign out</button></section><section class=c><div class=grid><div class=card><b>REQUESTED</b><div class=mut>New clinic requests waiting for review</div></div><div class=card><b>PROVISIONED</b><div class=mut>Tenant/access created; verification running</div></div><div class=card><b>ACTIVE</b><div class=mut>Verified pilots currently running</div></div></div></section><section class=c><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Pilot requests</h2><button id=refresh class="btn secondary">Refresh</button></div><div id=list class=mut style="margin-top:10px">Loading…</div></section></main><div id=toast class=msg></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co',KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw';const s=createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true}});const API=URL+'/functions/v1/pilot-onboarding';const LOGIN='https://haqn455-coder.github.io/phc-compliance-os-ui/p01-login.html';const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2600)}async function token(){const{data:{session}}=await s.auth.getSession();if(!session){location.replace(LOGIN);throw new Error('login required')}return session.access_token}async function call(path,opt={}){const tk=await token();const r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),authorization:'Bearer '+tk,'content-type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}function bool(v,label){return `<div class="${v?'ok':'bad'}">${v?'✓':'✕'} ${label}</div>`}async function load(){try{const j=await call('/admin/list');const rs=j.requests||[];list.innerHTML=rs.length?rs.map(render).join(''):'No requests yet.';wire()}catch(e){list.innerHTML='<div class=bad>'+h(e.message)+'</div>'}}function render(r){const v=r.verification_result||{};return `<div class=req data-id="${r.id}"><div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>${h(r.pilot_code||r.request_ref)} · ${h(r.clinic_name)}</b><div class=mut>${h(r.city)}${r.district?' · '+h(r.district):''} · ${h(r.clinic_type)}</div><div>${h(r.owner_name)} · ${h(r.owner_email)}</div></div><span class="tag ${h(r.status)}">${h(r.status)}</span></div><div class=actions>${r.status==='REQUESTED'?'<button class="btn provision">Approve & provision</button>':''}${['PROVISIONED','VERIFIED'].includes(r.status)?'<button class="btn secondary verify">Run verification</button>':''}${r.status==='VERIFIED'?'<button class="btn green activate">Activate 7-day pilot</button>':''}${r.pilot_code?'<button class="btn secondary access">Generate owner access link</button>':''}</div><div class=ver>${bool(!!v.tenant_exists,'Tenant')}${bool(!!v.facility_matches_tenant,'Facility isolation')}${bool(!!v.requirements_47,'47 indicators')}${bool(!!v.owner_invite_active,'Owner invite')}${bool(!!v.owner_access_ready,'Owner access')}${bool(!!v.workspace_register_linked,'Register workbook linked')}${bool(!!v.workspace_drive_linked,'Drive linked')}</div><div class=two style="margin-top:9px"><div class=field><input class=reg placeholder="Google Sheet/register workbook URL" value="${h(r.register_workbook_url||'')}"></div><div class=field><input class=drv placeholder="Google Drive folder URL" value="${h(r.drive_folder_url||'')}"></div></div><div class=actions><button class="btn secondary savews">Save workspace links</button></div></div>`}function wire(){document.querySelectorAll('.req').forEach(el=>{const id=el.dataset.id;el.querySelector('.provision')?.addEventListener('click',async()=>{try{const j=await call('/admin/provision',{method:'POST',body:JSON.stringify({id})});show('Provisioned: '+j.provision.pilot_code);await load()}catch(e){show(e.message)}});el.querySelector('.verify')?.addEventListener('click',async()=>{try{await call('/admin/verify',{method:'POST',body:JSON.stringify({id})});show('Verification updated');await load()}catch(e){show(e.message)}});el.querySelector('.activate')?.addEventListener('click',async()=>{try{await call('/admin/activate',{method:'POST',body:JSON.stringify({id})});show('Pilot activated');await load()}catch(e){show(e.message)}});el.querySelector('.access')?.addEventListener('click',async()=>{try{const j=await call('/admin/access-link',{method:'POST',body:JSON.stringify({id})});await navigator.clipboard.writeText(j.owner_access_link||'');show(j.owner_access_link?'Access link copied':'No link generated')}catch(e){show(e.message)}});el.querySelector('.savews')?.addEventListener('click',async()=>{try{await call('/admin/workspace',{method:'POST',body:JSON.stringify({id,register_workbook_url:el.querySelector('.reg').value,drive_folder_url:el.querySelector('.drv').value})});show('Workspace links saved');await load()}catch(e){show(e.message)}})})}refresh.onclick=load;out.onclick=async()=>{await s.auth.signOut();location.replace(LOGIN)};load();</script></body></html>
