<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PHC OS Trial Request</title>
  <style>
    :root{--nav:#0b3558;--blue:#1467a5;--bg:#eef3f8;--line:#dce5ee;--mut:#66788d}
    *{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui;background:var(--bg);color:#102338}
    .w{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,var(--nav),var(--blue));color:#fff;border-radius:22px;padding:22px}
    .c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{font-weight:750;display:block;margin-bottom:5px}.field{margin-bottom:12px}input,select{width:100%;padding:11px 12px;border:1px solid #cbd7e3;border-radius:10px;font:inherit;background:#fff}
    .btn{border:0;border-radius:10px;background:var(--nav);color:#fff;padding:12px 15px;font-weight:800}.mut{color:var(--mut)}
    .note{background:#fff5dc;border:1px solid #f0dfad;border-radius:12px;padding:11px}.ok{background:#e9f8f0;border:1px solid #ccead8;border-radius:12px;padding:12px}
    .err{background:#fff0ef;border:1px solid #f0ceca;border-radius:12px;padding:12px}.hp{position:absolute;left:-10000px}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.w{padding:9px}.hero{border-radius:16px}}
  </style>
</head>
<body><main class="w">
  <section class="hero"><h1 style="margin:0">PHC Compliance OS</h1><p>Request a controlled 3-day clinic trial</p></section>
  <section class="c"><h2>Trial request</h2><p class="mut">Clinic contact information only. Do not enter patient or clinical data. Submitting this form does not create an account or start the 72-hour trial.</p>
    <form id="request-form"><div class="grid">
      <div class="field"><label>Clinic name *</label><input name="clinic_name" required></div>
      <div class="field"><label>Doctor / owner name *</label><input name="owner_name" required></div>
      <div class="field"><label>Email *</label><input name="owner_email" type="email" required></div>
      <div class="field"><label>Phone</label><input name="phone" inputmode="tel"></div>
      <div class="field"><label>City *</label><input name="city" required></div>
      <div class="field"><label>District</label><input name="district"></div>
      <div class="field"><label>Clinic type *</label><select name="clinic_type" required><option value="GP">GP Clinic</option><option value="FAMILY_PHYSICIAN">Family Physician Clinic</option><option value="SPECIALIST_CLINIC">Specialist Clinic</option></select></div>
    </div>
    <div class="field hp"><label>Website</label><input name="website" autocomplete="off" tabindex="-1"></div>
    <div class="note"><label><input id="terms" type="checkbox" style="width:auto"> I understand access begins only after founder approval/provisioning, and this trial is not PHC approval, certification, legal representation, or an inspection/licensing guarantee.</label></div>
    <p><button id="send" class="btn" type="submit">Submit trial request</button></p><div id="msg"></div>
    </form>
  </section>
</main>
<script>
const API='https://auzbkudpqdmrgyxtwaiy.supabase.co/functions/v1/pilot-onboarding/request';
const form=document.getElementById('request-form'),terms=document.getElementById('terms'),send=document.getElementById('send'),msg=document.getElementById('msg');
form.onsubmit=async event=>{event.preventDefault();msg.className='';msg.textContent='';if(!terms.checked){msg.className='err';msg.textContent='Please accept the trial boundary before submitting.';return}send.disabled=true;send.textContent='Submitting…';const payload=Object.fromEntries(new FormData(form));payload.accept_terms=true;try{const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok)throw new Error(result.error||'Could not submit');form.innerHTML=`<div class="ok"><h3>Request received</h3><p>Your reference is <b>${result.request_ref}</b>.</p><p>No account or trial has started yet. PHC OS will first approve and provision the clinic.</p></div>`}catch(error){msg.className='err';msg.textContent=error.message;send.disabled=false;send.textContent='Submit trial request'}};
</script></body></html>
