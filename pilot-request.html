<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHC OS Pilot Request</title><style>:root{--nav:#0b3558;--blue:#1467a5;--bg:#eef3f8;--line:#dce5ee;--mut:#66788d}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui;background:var(--bg);color:#102338}.w{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,var(--nav),var(--blue));color:#fff;border-radius:22px;padding:22px}.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:750;display:block;margin-bottom:5px}.field{margin-bottom:12px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd7e3;border-radius:10px;font:inherit;background:#fff}textarea{min-height:82px}.btn{border:0;border-radius:10px;background:var(--nav);color:#fff;padding:12px 15px;font-weight:800}.mut{color:var(--mut)}.note{background:#fff5dc;border:1px solid #f0dfad;border-radius:12px;padding:11px}.ok{background:#e9f8f0;border:1px solid #ccead8;border-radius:12px;padding:12px}.err{background:#fff0ef;border:1px solid #f0ceca;border-radius:12px;padding:12px}.hp{position:absolute;left:-10000px}@media(max-width:650px){.grid{grid-template-columns:1fr}.w{padding:9px}.hero{border-radius:16px}}</style></head><body><main class=w><section class=hero><h1 style="margin:0">PHC Compliance OS</h1><p>Controlled clinic pilot request</p></section><section class=c><h2>Request a pilot</h2><p class=mut>For Punjab outpatient GP, Family Physician and Specialist Clinics. Initial onboarding uses compliance/administrative information only — no patient-identifiable data.</p><form id=f><div class=grid><div class=field><label>Clinic name *</label><input name=clinic_name required></div><div class=field><label>City *</label><input name=city required></div><div class=field><label>District</label><input name=district></div><div class=field><label>Owner / responsible clinician *</label><input name=owner_name required></div><div class=field><label>Owner email *</label><input name=owner_email type=email required></div><div class=field><label>Phone</label><input name=phone inputmode=tel></div><div class=field><label>Clinic type *</label><select name=clinic_type required><option value=GP>GP Clinic</option><option value=FAMILY_PHYSICIAN>Family Physician Clinic</option><option value=SPECIALIST_CLINIC>Specialist Clinic</option></select></div><div class=field><label>Current PHC status</label><select name=phc_status><option value=UNKNOWN>Not sure / unknown</option><option value=REGISTERED_LICENSED>Registered / licensed</option><option value=APPLIED_PENDING>Applied / pending</option><option value=NOT_REGISTERED>Not registered</option></select></div></div><div class=field><label>Services actually provided</label><textarea name=services placeholder="e.g. consultation, minor procedures, dispensing if applicable"></textarea></div><div class=grid><div class=field><label>Current staff roles</label><textarea name=staff_summary placeholder="e.g. doctor, receptionist, dispenser"></textarea></div><div class=field><label>Operating hours</label><textarea name=operating_hours></textarea></div></div><div class=field><label><input id=g type=checkbox style="width:auto"> Clinic has access to a Google account/Drive if needed for register persistence</label></div><div class="field hp"><label>Website</label><input name=website autocomplete=off tabindex=-1></div><div class=note><label><input id=t type=checkbox style="width:auto"> I understand this is a controlled pilot for compliance organization/evidence readiness and is not PHC approval, certification, legal representation or an inspection/licensing guarantee.</label></div><p><button id=send class=btn type=submit>Submit pilot request</button></p><div id=msg></div></form></section></main><script>const API='https://auzbkudpqdmrgyxtwaiy.supabase.co/functions/v1/pilot-onboarding/request';f.onsubmit=async e=>{e.preventDefault();msg.className='';msg.textContent='';if(!t.checked){msg.className='err';msg.textContent='Please accept the pilot boundary before submitting.';return}send.disabled=true;send.textContent='Submitting…';const d=Object.fromEntries(new FormData(f));d.google_account_available=g.checked;d.accept_terms=true;try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not submit');f.innerHTML=`<div class="ok"><h3>Request received</h3><p>Your reference is <b>${j.request_ref}</b>.</p><p>We will first verify clinic scope. No patient data is needed at this stage.</p></div>`}catch(x){msg.className='err';msg.textContent=x.message;send.disabled=false;send.textContent='Submit pilot request'}}</script></body></html>
