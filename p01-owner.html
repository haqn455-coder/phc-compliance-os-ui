<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHC Compliance OS — P01 Owner</title><style>body{margin:0;font:15px system-ui;background:#f4f7fb;color:#17212b}.s{max-width:980px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:16px;margin:12px 0}.b{border:0;border-radius:10px;padding:11px 14px;background:#173f68;color:#fff;font-weight:700;cursor:pointer}.b2{background:#eaf0f6;color:#17212b}.mut{color:#657384}.ok{background:#e7f6ec;padding:10px;border-radius:9px}.err{background:#fdeaea;padding:10px;border-radius:9px}.warn{background:#fff3d8;padding:10px;border-radius:9px}.g{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}input{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;font:inherit;box-sizing:border-box}.stat{background:#f7f9fc;border-radius:12px;padding:12px}.n{font-size:26px;font-weight:800}.item{border-left:4px solid #173f68;background:#f8fafc;padding:10px 12px;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:720px){.g2{grid-template-columns:1fr}}</style></head><body><div class=s id=app><div class=c><h1>PHC Compliance OS</h1><p class=mut>P01 owner access</p><div id=note class=warn>Checking secure session…</div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co';const KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw';const supabase=createClient(URL,KEY);const OWNER_EMAIL='haqn455@gmail.com';const REG='https://docs.google.com/spreadsheets/d/1CQuHsM4U-C97JvLcnfBYwj0Pw65-Ca-B6XnIFHou_Nw/edit';const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function login(msg=''){app.innerHTML=`<div class=c><h1>PHC Compliance OS</h1><p class=mut>P01 · Zain Child Care Clinic · private first-consumer access</p>${msg?`<div class=err>${h(msg)}</div>`:''}<div class=warn>Access is restricted to the invited owner email. No Google Apps Script authorization is used for sign-in.</div><label><b>Email</b><input id=em type=email value="${OWNER_EMAIL}"></label><p><button id=send class=b>Send secure sign-in link</button></p><p class=mut>The link will be sent to your email. Open it on this device to enter the owner workspace.</p></div>`;send.onclick=async()=>{const email=em.value.trim().toLowerCase();if(email!==OWNER_EMAIL)return login('This P01 portal is currently restricted to the invited owner email.');send.disabled=true;send.textContent='Sending…';const{error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return login(error.message);app.innerHTML=`<div class=c><h2>Check your email</h2><div class=ok>Secure sign-in link sent to <b>${h(email)}</b>.</div><p class=mut>Click the link in the email. No password is required.</p></div>`}}async function load(){const{data:{session}}=await supabase.auth.getSession();if(!session)return login();const{data:ms,error:me}=await supabase.from('memberships').select('tenant_id,role').limit(1);if(me||!ms?.length)return login('Signed in, but this email has no active PHC OS tenant access.');const m=ms[0];const{data:ts}=await supabase.from('tenants').select('name').eq('id',m.tenant_id).limit(1);const{data:fs}=await supabase.from('facilities').select('id,name,phc_category').eq('tenant_id',m.tenant_id).limit(1);const f=fs?.[0];const{data:fr}=await supabase.from('facility_requirements').select('requirement_definition_id,state,review_decision').eq('tenant_id',m.tenant_id);const{data:defs}=await supabase.from('requirement_definitions').select('id,indicator_no,standard_code,indicator_text').order('indicator_no');const map=new Map((fr||[]).map(x=>[x.requirement_definition_id,x]));const rows=(defs||[]).map(d=>({...d,...(map.get(d.id)||{})}));const counts={total:rows.length,ready:rows.filter(r=>r.state==='READY').length,review:rows.filter(r=>r.review_decision&&r.review_decision!=='PENDING').length};app.innerHTML=`<div class=c><div class=toolbar><div><h1 style="margin:0">PHC Compliance OS</h1><p class=mut>${h(ts?.[0]?.name||'P01')} · ${h(f?.name||'Clinic')}</p></div><button id=out class="b b2" style="margin-left:auto">Sign out</button></div><div class=ok>Owner session active · role: ${h(m.role)}</div></div><div class="g g2"><div class=stat><div class=n>${counts.total}</div><div>PHC indicators loaded</div></div><div class=stat><div class=n>${counts.ready}</div><div>Currently READY</div></div></div><div class=c><h2>Digital Register Centre</h2><p>Operational compliance/admin registers are maintained in the clinic-owned workbook.</p><p><a class=b href="${REG}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Open Digital Registers</a></p><p class=mut>Includes patient registration audit, emergency inventory, medicine temperature/expiry, dispensing, ADR, referral, complaint, QA/QI, infection control, waste, consent/refusal, staff training and admin registers.</p></div><div class=c><h2>47-Indicator Readiness</h2><div class=g>${rows.map(r=>`<div class=item><b>${h(r.standard_code||'')} · Indicator ${h(r.indicator_no)}</b><br>${h(r.indicator_text||'')}<br><span class=mut>Status: ${h(r.state||'NOT_STARTED')} · Review: ${h(r.review_decision||'PENDING')}</span></div>`).join('')}</div></div><div class=c><div class=warn>This workspace supports compliance organization and evidence readiness. It is not PHC approval, certification or an inspection guarantee.</div></div>`;out.onclick=async()=>{await supabase.auth.signOut();login()}}supabase.auth.onAuthStateChange(()=>load());load();</script></body></html>
