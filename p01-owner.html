<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHC Compliance OS — P01 Owner</title><style>body{margin:0;font:15px system-ui;background:#f4f7fb;color:#17212b}.s{max-width:1040px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:16px;margin:12px 0}.b{border:0;border-radius:10px;padding:11px 14px;background:#173f68;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.b2{background:#eaf0f6;color:#17212b}.mut{color:#657384}.ok{background:#e7f6ec;padding:10px;border-radius:9px}.warn{background:#fff3d8;padding:12px;border-radius:9px}.guide{background:#eef5ff;border:1px solid #d4e3f5;padding:13px;border-radius:12px}.g{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.stat{background:#f7f9fc;border-radius:12px;padding:12px}.n{font-size:26px;font-weight:800}.item{border-left:4px solid #173f68;background:#f8fafc;padding:12px;border-radius:8px}.item details{margin-top:8px}.item summary{cursor:pointer;font-weight:700;color:#173f68}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}.tag{display:inline-block;background:#eef2f7;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:700;margin-top:5px}.prompt{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:9px;margin-top:8px}.steps{margin:6px 0 0 18px;padding:0}.steps li{margin:4px 0}@media(max-width:720px){.g2{grid-template-columns:1fr}}</style></head><body><div class=s id=app><div class=c><h1>PHC Compliance OS</h1><p class=mut>Checking secure owner session…</p></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co';const KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});const LOGIN='https://haqn455-coder.github.io/phc-compliance-os-ui/p01-login.html';const REG='https://docs.google.com/spreadsheets/d/1CQuHsM4U-C97JvLcnfBYwj0Pw65-Ca-B6XnIFHou_Nw/edit';const GUIDE='https://docs.google.com/spreadsheets/d/1CQuHsM4U-C97JvLcnfBYwj0Pw65-Ca-B6XnIFHou_Nw/edit#gid=2119';const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nextAction(r){const st=r.state||'NOT_STARTED';if(st==='READY')return'Keep the evidence current. Recheck after any real change in staff, service, display, expiry, equipment or process.';if(st==='NEEDS_ACTION')return'Open the gap, assign one owner and one due date, then attach/link the proof when the action is genuinely completed.';if(st==='MANUAL_REVIEW'||r.review_decision==='PENDING')return'Collect the evidence, but keep the final judgment with the clinic owner/reviewer. Do not auto-declare compliance.';return'Start with one real check: confirm whether the requirement applies, then collect the minimum evidence needed to prove the current situation.'}async function load(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace(LOGIN);return}const{data:ms,error:me}=await supabase.from('memberships').select('tenant_id,role').limit(1);if(me||!ms?.length){await supabase.auth.signOut();location.replace(LOGIN);return}const m=ms[0];const{data:ts}=await supabase.from('tenants').select('name').eq('id',m.tenant_id).limit(1);const{data:fs}=await supabase.from('facilities').select('id,name,phc_category').eq('tenant_id',m.tenant_id).limit(1);const f=fs?.[0];const{data:fr}=await supabase.from('facility_requirements').select('requirement_definition_id,state,review_decision').eq('tenant_id',m.tenant_id);const{data:defs}=await supabase.from('requirement_definitions').select('id,indicator_no,standard_code,indicator_text,evidence_prompt').order('indicator_no');const map=new Map((fr||[]).map(x=>[x.requirement_definition_id,x]));const rows=(defs||[]).map(d=>({...d,...(map.get(d.id)||{})}));const counts={total:rows.length,ready:rows.filter(r=>r.state==='READY').length,action:rows.filter(r=>r.state==='NEEDS_ACTION').length,pending:rows.filter(r=>!r.review_decision||r.review_decision==='PENDING').length};app.innerHTML=`<div class=c><div class=toolbar><div><h1 style="margin:0">PHC Compliance OS</h1><p class=mut>${h(ts?.[0]?.name||'P01')} · ${h(f?.name||'Clinic')}</p></div><button id=out class="b b2" style="margin-left:auto">Sign out</button></div><div class=ok>Owner session active · role: ${h(m.role)}</div></div><div class=guide><h2 style="margin-top:0">Use PHC OS as a small weekly habit — not an inspection-day emergency.</h2><p>Keep real evidence as work happens. Review readiness once a week, enter a real register event on the same day, and close one visible gap at a time. The goal is simple: know what is READY, what still needs action, and where the proof is stored before anyone asks for it.</p><ol class=steps><li><b>5-minute weekly readiness review</b></li><li><b>Same-day entry for real events</b> — no backdating or invented rows</li><li><b>Link evidence when an action closes</b> — minimum necessary/redacted where appropriate</li></ol></div><div class="g g2"><div class=stat><div class=n>${counts.total}</div><div>PHC indicators loaded</div></div><div class=stat><div class=n>${counts.ready}</div><div>Currently READY</div></div><div class=stat><div class=n>${counts.action}</div><div>Needs action</div></div><div class=stat><div class=n>${counts.pending}</div><div>Pending human review</div></div></div><div class=c><h2>Digital Register Centre</h2><p><b>How to use it:</b> record only real events. Use the clinic-owned Google Sheet as the operational register and keep related PDFs/photos/letters in the clinic-owned Drive archive. Training examples belong in guidance only, never in live registers.</p><div class=toolbar><a class=b href="${REG}" target="_blank" rel="noopener">Open Digital Registers</a><a class="b b2" href="${GUIDE}" target="_blank" rel="noopener">Open Register Guidance & DEMO Examples</a></div><div class=warn style="margin-top:12px"><b>Drive / Sheets model:</b> P01 is already tied to its clinic-owned workbook and Drive archive. Future clinics should get their own tenant plus assigned Sheet/Drive locations. Reuse an existing suitable register where possible instead of forcing duplicate paper + digital work.</div><p class=mut>Complex registers now have training examples in the GUIDANCE tab — including sentinel-event workflow, QA/QI, ADR, consent/refusal, complaint, referral, emergency inventory, infection control and administrative diaries.</p></div><div class=c><h2>47-Indicator Readiness + Practical Guidance</h2><p class=mut>Tap “Show practical suggestion” under any indicator. Suggestions support organization and evidence collection; final regulatory/clinical judgment remains human-controlled.</p><div class=g>${rows.map(r=>`<div class=item><b>${h(r.standard_code||'')} · Indicator ${h(r.indicator_no)}</b><br>${h(r.indicator_text||'')}<br><span class=tag>Status: ${h(r.state||'NOT_STARTED')}</span> <span class=tag>Review: ${h(r.review_decision||'PENDING')}</span><details><summary>Show practical suggestion</summary><div class=prompt><b>Suggested evidence</b><br>${h(r.evidence_prompt||'Collect current evidence that directly demonstrates this requirement.')}</div><div class=prompt><b>What to do next</b><br>${h(nextAction(r))}</div><div class=prompt><b>Good practice</b><br>Use current, real evidence; avoid duplicate documentation; keep patient-identifiable information to the minimum necessary; if the requirement is unclear or service-specific, hold for human review rather than forcing PASS.</div></details></div>`).join('')}</div></div><div class=c><div class=warn><b>Boundary:</b> PHC OS organizes readiness, evidence and operational records. It does not guarantee PHC approval, certification, inspection outcome, or autonomously decide clinical/regulatory adequacy.</div></div>`;out.onclick=async()=>{await supabase.auth.signOut();location.replace(LOGIN)}}load();</script></body></html>
