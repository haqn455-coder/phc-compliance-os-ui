<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHC Compliance OS</title><style>body{margin:0;font:15px system-ui;background:#f6f8fb;color:#17212b}.s{max-width:900px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #dde5ee;border-radius:15px;padding:16px;margin:12px 0}.b{border:0;border-radius:9px;padding:11px 14px;font-weight:700;background:#173f68;color:#fff;cursor:pointer}.b2{background:#eaf0f6;color:#17212b}.b:active{transform:scale(.98)}.g{display:grid;gap:12px}.f{display:grid;gap:5px;margin:9px 0}input,select,textarea{padding:10px;border:1px solid #ccd5df;border-radius:9px;font:inherit}textarea{min-height:82px}.st{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2f7;font-weight:700}.READY{background:#e7f6ec}.REVIEW{background:#fff3d8}.EXPIRED,.NEEDS_ACTION{background:#fdeaea}.n{padding:9px;border-radius:9px;background:#edf6ff}.e{background:#fdeaea}.ok{background:#e7f6ec}.mut{color:#657384}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#e7f6ec;font-size:12px;font-weight:700;margin-bottom:8px}.warn{background:#fff3d8;padding:10px;border-radius:9px}.snap-action{border-left:4px solid #173f68;padding:10px 12px;margin:10px 0;background:#f8fafc}.verify{font-weight:700}.choices{display:grid;gap:7px}.choices label{display:flex;gap:8px;align-items:flex-start}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(min-width:720px){.g2{grid-template-columns:1.15fr .85fr}}@media print{body{background:#fff}.no-print{display:none!important}.s{max-width:none;padding:0}.c{border:0;box-shadow:none;margin:0;padding:8px 0}.snapshot-print{font-size:12px}.snap-action{break-inside:avoid}}</style></head><body><div id="app"></div><script src="./product/gp_snapshot_ops_ui.js"></script><script>
const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co';
const KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw';
const API=URL+'/functions/v1/phc-api';
const R=URL+'/rest/v1/';
const A=s=>document.querySelector(s);let x={},TOKEN='';
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(m,k='n'){const n=A('#note');if(n){n.className=k;n.textContent=m}}
function decodeSub(t){try{let p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');p+='='.repeat((4-p.length%4)%4);return JSON.parse(atob(p)).sub}catch{return''}}
function captureToken(){TOKEN=localStorage.getItem('phc_token')||''}
async function rest(path,opt={}){const headers={apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(R+path,{...opt,headers});const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw Error((data&&data.message)||txt||('HTTP '+r.status));return data}
async function testLogin(p){note('Creating synthetic '+p+' session…');try{const r=await fetch(API+'/test-session?persona='+encodeURIComponent(p));const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.detail||j.error||'Test session failed');localStorage.setItem('phc_token',j.access_token);TOKEN=j.access_token;await refresh()}catch(e){note(e.message,'n e')}}
async function passwordLogin(email,password){const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.message||'Login failed');localStorage.setItem('phc_token',j.access_token);TOKEN=j.access_token}
function login(){document.querySelector('#app').innerHTML=`<div class=s><div class=c><div class=badge>JS ACTIVE</div><h2>PHC Compliance OS</h2><p class=mut>Inspection-readiness workspace.</p><div id=note class=n>Testing ke liye neeche Owner A use karein. Personal credentials ki zarurat nahi.</div><form id=lf><label class=f>Email<input id=em type=email></label><label class=f>Password<input id=pw type=password></label><button class=b type=submit>Sign in</button></form><hr><p class=mut>Synthetic E2E</p><div class=g style="grid-template-columns:repeat(2,1fr)"><button class="b b2" id=ownerA type=button>Owner A</button><button class="b b2" id=reviewerA type=button>Reviewer A</button><button class="b b2" id=viewerA type=button>Viewer A</button><button class="b b2" id=ownerB type=button>Owner B</button></div></div></div>`;A('#ownerA').onclick=()=>testLogin('ownerA');A('#reviewerA').onclick=()=>testLogin('reviewerA');A('#viewerA').onclick=()=>testLogin('viewerA');A('#ownerB').onclick=()=>testLogin('ownerB');A('#lf').onsubmit=async e=>{e.preventDefault();try{await passwordLogin(A('#em').value,A('#pw').value);await refresh()}catch(err){note(err.message,'n e')}}}
async function load(){const uid=decodeSub(TOKEN);if(!uid)throw Error('Invalid session');const ms=await rest('memberships?select=tenant_id,role&user_id=eq.'+uid+'&limit=1');if(!ms.length)throw Error('No membership');const m=ms[0];const ts=await rest('tenants?select=name&id=eq.'+m.tenant_id+'&limit=1');const fs=await rest('facilities?select=id,name&tenant_id=eq.'+m.tenant_id+'&limit=1');const rs=await rest('facility_requirements?select=*&tenant_id=eq.'+m.tenant_id+'&limit=1');if(!fs.length||!rs.length)throw Error('Synthetic facility/requirement missing');const f=fs[0],r=rs[0];const ds=await rest('requirement_definitions?select=*&id=eq.'+r.requirement_definition_id+'&limit=1');const cs=await rest('credentials?select=*&tenant_id=eq.'+m.tenant_id+'&facility_id=eq.'+f.id+'&credential_type=eq.PMDC&order=updated_at.desc&limit=1');const vs=await rest('evidence_items?select=*&facility_requirement_id=eq.'+r.id+'&order=uploaded_at.desc');x={uid,m,t:ts[0]||{},f,r,d:ds[0]||{},c:cs[0]||null,v:vs||[]}}
function view(){const E=['owner','manager'].includes(x.m.role),RV=['owner','reviewer'].includes(x.m.role),ce=x.v.filter(z=>z.evidence_type==='credential_certificate'),ph=x.v.filter(z=>z.evidence_type==='display_photo');document.querySelector('#app').innerHTML=`<div class=s><div class=c><div class=badge>SESSION ACTIVE</div><b>PHC Compliance OS</b><span class=mut> · ${h(x.t.name)} · ${h(x.f.name)}</span><button id=out class="b b2" style="float:right">Sign out</button>${E?'<div class=toolbar><button id=snap class="b b2" type=button>Internal GP Readiness Snapshot</button><button id=snapops class="b b2" type=button>Snapshot Operations</button></div>':''}</div><div id=note class=n>Role: ${h(x.m.role)} · RLS tenant isolation active</div><div class="g g2"><div class=c><small class=mut>${h(x.d.standard_code)} · Indicator ${x.d.indicator_no}</small><h2>PM&DC certificate displayed</h2><p>${h(x.d.indicator_text)}</p><span class="st ${h(x.r.state)}">${h(x.r.state)}</span><p class=mut>Review: ${h(x.r.review_decision)}</p><h3>Credential</h3><label class=f>Registration number<input id=reg value="${h(x.c?.registration_number||'')}" ${E?'':'disabled'}></label><label class=f>Expiry<input id=exp type=date value="${h(x.c?.expiry_date||'')}" ${E?'':'disabled'}></label>${E?'<button id=sc class="b b2">Save credential</button>':''}<h3>Certificate</h3><p>${ce.length?'✓ Uploaded':'Missing'}</p>${E?'<input id=cf type=file accept="application/pdf,image/jpeg,image/png"><button id=uc class="b b2">Upload certificate</button>':''}<h3>Display photo</h3><p>${ph.length?'✓ Uploaded':'Missing'}</p>${E?'<input id=pf type=file accept="image/jpeg,image/png"><button id=up class="b b2">Upload photo</button>':''}<p>${E?'<button id=sync class=b>Submit / recompute</button>':''} ${RV?'<button id=ap class=b>Approve</button> <button id=rj class="b b2">Reject</button>':''}</p></div><div class=c><button id=ir class="b b2">Inspection Room</button><h3>Evidence</h3>${x.v.length?x.v.map(z=>`<p><b>${h(z.evidence_type)}</b><br><span class=mut>${h(z.original_filename)}</span></p>`).join(''):'<p class=mut>No evidence.</p>'}<div id=iv></div></div></div></div>`;A('#out').onclick=()=>{localStorage.removeItem('phc_token');TOKEN='';login()};A('#ir').onclick=inspect;if(E){A('#snap').onclick=snapshotMode;A('#snapops').onclick=snapshotOpsMode;A('#sc').onclick=save;A('#uc').onclick=()=>upload('credential_certificate','#cf');A('#up').onclick=()=>upload('display_photo','#pf');A('#sync').onclick=sync}if(RV){A('#ap').onclick=()=>review('APPROVED');A('#rj').onclick=()=>review('REJECTED')}}
async function save(){const p={tenant_id:x.m.tenant_id,facility_id:x.f.id,clinician_user_id:x.uid,credential_type:'PMDC',registration_number:A('#reg').value.trim(),expiry_date:A('#exp').value||null,renewal_in_progress:false};try{if(x.c?.id)await rest('credentials?id=eq.'+x.c.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});else await rest('credentials',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});note('Credential saved','n ok');await refresh()}catch(e){note(e.message,'n e')}}
async function upload(type,sel){const f=A(sel).files?.[0];if(!f)return note('Choose a file first','n e');const fd=new FormData();fd.append('file',f);fd.append('evidence_type',type);fd.append('requirement_id',x.r.id);const r=await fetch(API+'/upload',{method:'POST',headers:{Authorization:'Bearer '+TOKEN},body:fd});const j=await r.json();if(!r.ok)return note(j.error||'Upload failed','n e');note('Evidence uploaded','n ok');await refresh()}
async function sync(){try{const d=await rest('rpc/sync_indicator7_state',{method:'POST',body:JSON.stringify({target_requirement:x.r.id})});note('State: '+d,'n ok');await refresh()}catch(e){note(e.message,'n e')}}
async function review(d){try{await rest('facility_requirements?id=eq.'+x.r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({review_decision:d})});await sync()}catch(e){note(e.message,'n e')}}
async function inspect(){try{const d=await rest('inspection_indicator7?select=*&facility_requirement_id=eq.'+x.r.id+'&limit=1');const z=d[0];A('#iv').innerHTML=z?`<hr><h3>Read-only Inspection Room</h3><p><b>${h(z.indicator_text)}</b></p><p>Status: <span class="st ${h(z.state)}">${h(z.state)}</span></p><p>Certificate evidence: ${z.credential_evidence_count}<br>Display photo: ${z.display_photo_count}<br>Review: ${h(z.review_decision)}</p><small class=mut>This is evidence-readiness, not PHC approval.</small>`:'No inspection row'}catch(e){note(e.message,'n e')}}
function fieldMarkup(q,answers){const val=answers[q.id];if(q.type==='multi_select'){return `<div class=choices>${(q.values||[]).map(v=>`<label><input type=checkbox data-q="${h(q.id)}" value="${h(v)}" ${Array.isArray(val)&&val.includes(v)?'checked':''}> ${h(v)}</label>`).join('')}</div>`}if(q.type==='single_select'){return `<select data-q="${h(q.id)}"><option value="">Select…</option>${(q.values||[]).map(v=>`<option value="${h(v)}" ${val===v?'selected':''}>${h(v)}</option>`).join('')}</select>`}const type=q.type==='phone'?'tel':'text';return `<input data-q="${h(q.id)}" type="${type}" value="${h(val||'')}">`}
function readSnapshotAnswers(config){const out={};for(const q of config.questions||[]){const nodes=[...document.querySelectorAll(`[data-q="${q.id}"]`)];if(!nodes.length)continue;if(q.type==='multi_select')out[q.id]=nodes.filter(n=>n.checked).map(n=>n.value);else out[q.id]=nodes[0].value}return out}
async function snapshotMode(){if(!['owner','manager'].includes(x.m.role))return note('Operator access required','n e');try{const [cfg,evalMod,formMod]=await Promise.all([fetch('./product/gp_readiness_snapshot_v0_1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Snapshot config unavailable');return r.json()}),import('./product/gp_readiness_snapshot_eval.mjs'),import('./product/gp_snapshot_form_logic.mjs')]);const state={answers:{},result:null,saved:null};const render=()=>{const qs=formMod.visibleQuestions(cfg,state.answers);document.querySelector('#app').innerHTML=`<div class=s><div class="c no-print"><div class=badge>INTERNAL OPERATOR ONLY</div><h2>GP Readiness Snapshot</h2><p class=mut>15–20 minute preliminary presales workflow. Uses frozen Snapshot config only; it does not call runtime TEST_ONLY compliance rules.</p><div class=warn>${h(cfg.disclaimer)}</div><div class=toolbar><button id=back class="b b2" type=button>Back</button></div></div><form id=sform class=no-print>${qs.map(q=>`<div class=c><label class=f><b>${h(q.label)}</b>${fieldMarkup(q,state.answers)}</label></div>`).join('')}<div class=c><button class=b type=submit>Generate preliminary snapshot</button></div></form><div id=sresult></div></div>`;A('#back').onclick=refresh;for(const el of document.querySelectorAll('[data-q]')){el.onchange=()=>{state.answers=readSnapshotAnswers(cfg);render()};if(el.tagName==='INPUT'&&['text','tel'].includes(el.type))el.oninput=()=>{state.answers=readSnapshotAnswers(cfg)}}A('#sform').onsubmit=async e=>{e.preventDefault();state.answers=readSnapshotAnswers(cfg);try{for(const q of formMod.visibleQuestions(cfg,state.answers)){if(q.required){const v=state.answers[q.id];if(v==null||v===''||(Array.isArray(v)&&!v.length))throw Error('Please complete: '+q.label)}}state.result=evalMod.evaluateSnapshot(cfg,state.answers);const payload=formMod.buildPresalesPayload(cfg,state.answers,state.result,x.m.tenant_id);const saved=await rest('presales_snapshots',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});state.saved=saved?.[0]||null;renderSnapshotResult(cfg,state.answers,state.result,formMod,state.saved)}catch(err){alert(err.message)}}};render()}catch(e){note(e.message,'n e')}}
function renderSnapshotResult(cfg,answers,result,formMod,saved){const m=formMod.snapshotOutputModel(cfg,answers,result);document.querySelector('#app').innerHTML=`<div class=s><div class="c no-print"><div class=badge>INTERNAL OPERATOR ONLY</div><div class=toolbar><button id=edit class="b b2" type=button>Back to workspace</button><button id=print class=b type=button>Print / Save PDF</button></div>${saved?`<div class="n ok">Saved presales snapshot: ${h(saved.id)}</div>`:'<div class="n e">Snapshot was not persisted.</div>'}</div><div class="c snapshot-print"><h1>${h(m.title)}</h1><p><b>Clinic:</b> ${h(m.clinic)}<br><b>Location:</b> ${h(m.location)}<br><b>Clinic type:</b> ${h(m.clinic_type)}<br><b>PHC stage:</b> ${h(m.licence_stage_as_reported)} <span class=mut>(as reported by clinic)</span></p><h2>Preliminary readiness actions</h2>${m.actions.length?m.actions.map((z,i)=>`<div class=snap-action><b>${i+1}. ${h(z.gap)}</b>${z.verification_required?'<div class=verify>Verification required — answer was uncertain.</div>':''}<p><b>Next action:</b> ${h(z.next_action)}</p><p><b>Evidence to prepare:</b> ${h(z.evidence_to_prepare)}</p></div>`).join(''):'<p>No preview rules were triggered from the answers supplied. Do not interpret this as PHC compliance or a pass result.</p>'}<div class=warn><b>Scope note:</b> ${h(m.disclaimer)}</div><hr><h2>${h(m.cta.name)}</h2><p><b>PKR ${Number(m.cta.price_pkr).toLocaleString()} · ${h(m.cta.duration_days)} days · first ${h(m.cta.capacity)} suitable clinics</b></p><p>${h(m.cta.copy)}</p></div></div>`;A('#edit').onclick=refresh;A('#print').onclick=()=>window.print()}
async function refresh(){await load();view()}
async function boot(){captureToken();if(!TOKEN)return login();try{await refresh()}catch(e){localStorage.removeItem('phc_token');TOKEN='';login();setTimeout(()=>note(e.message,'n e'),0)}}
boot();
</script></body></html>
