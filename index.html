<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHC Compliance OS</title><style>body{margin:0;font:15px system-ui;background:#f6f8fb;color:#17212b}.s{max-width:900px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #dde5ee;border-radius:15px;padding:16px;margin:12px 0}.b{border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:#173f68;color:#fff}.b2{background:#eaf0f6;color:#17212b}.g{display:grid;gap:12px}.f{display:grid;gap:5px;margin:9px 0}input{padding:10px;border:1px solid #ccd5df;border-radius:9px}.st{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2f7;font-weight:700}.READY{background:#e7f6ec}.REVIEW{background:#fff3d8}.EXPIRED,.NEEDS_ACTION{background:#fdeaea}.n{padding:9px;border-radius:9px;background:#edf6ff}.e{background:#fdeaea}.ok{background:#e7f6ec}.mut{color:#657384}@media(min-width:720px){.g2{grid-template-columns:1.15fr .85fr}}</style></head><body><div id="app"></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co',KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw',API=URL+'/functions/v1/phc-api',sb=createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true}}),A=document.querySelector.bind(document);let x={};const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(m,k='n'){let n=A('#note');if(n){n.className=k;n.textContent=m}}async function testLogin(p){let t=await fetch(API+'/harness-token').then(r=>r.json());let r=await fetch(API+'/test-login?persona='+p+'&token='+encodeURIComponent(t.token)+'&redirect='+encodeURIComponent(location.origin+location.pathname)),j=await r.json();if(!r.ok)return note(j.error,'n e');location.href=j.action_link}function login(){document.querySelector('#app').innerHTML=`<div class=s><div class=c><h2>PHC Compliance OS</h2><p class=mut>Inspection-readiness workspace.</p><div id=note class=n>Sign in to continue.</div><form id=lf><label class=f>Email<input id=em type=email required></label><label class=f>Password<input id=pw type=password required></label><button class=b>Sign in</button></form><hr><p class=mut>Synthetic E2E</p><button class="b b2" data-p=ownerA>Owner A</button> <button class="b b2" data-p=reviewerA>Reviewer A</button> <button class="b b2" data-p=viewerA>Viewer A</button> <button class="b b2" data-p=ownerB>Owner B</button></div></div>`;A('#lf').onsubmit=async q=>{q.preventDefault();let{error}=await sb.auth.signInWithPassword({email:A('#em').value,password:A('#pw').value});error?note(error.message,'n e'):boot()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>testLogin(b.dataset.p))}async function load(){let{data:{user}}=await sb.auth.getUser();if(!user)throw Error('No session');let{data:m,error}=await sb.from('memberships').select('tenant_id,role').eq('user_id',user.id).limit(1).single();if(error)throw error;let{data:t}=await sb.from('tenants').select('name').eq('id',m.tenant_id).single(),{data:f}=await sb.from('facilities').select('id,name').eq('tenant_id',m.tenant_id).limit(1).single(),{data:r}=await sb.from('facility_requirements').select('*').eq('tenant_id',m.tenant_id).limit(1).single(),{data:d}=await sb.from('requirement_definitions').select('*').eq('id',r.requirement_definition_id).single(),{data:c}=await sb.from('credentials').select('*').eq('tenant_id',m.tenant_id).eq('facility_id',f.id).eq('credential_type','PMDC').order('updated_at',{ascending:false}).limit(1).maybeSingle(),{data:v}=await sb.from('evidence_items').select('*').eq('facility_requirement_id',r.id).order('uploaded_at',{ascending:false});x={user,m,t,f,r,d,c,v:v||[]}}function view(){let E=['owner','manager'].includes(x.m.role),R=['owner','reviewer'].includes(x.m.role),ce=x.v.filter(z=>z.evidence_type==='credential_certificate'),ph=x.v.filter(z=>z.evidence_type==='display_photo');document.querySelector('#app').innerHTML=`<div class=s><div class=c><b>PHC Compliance OS</b><span class=mut> · ${h(x.t.name)} · ${h(x.f.name)}</span><button id=out class="b b2" style="float:right">Sign out</button></div><div id=note class=n>Role: ${h(x.m.role)} · RLS tenant isolation active</div><div class="g g2"><div class=c><small class=mut>${h(x.d.standard_code)} · Indicator ${x.d.indicator_no}</small><h2>PM&DC certificate displayed</h2><p>${h(x.d.indicator_text)}</p><span class="st ${h(x.r.state)}">${h(x.r.state)}</span><p class=mut>Review: ${h(x.r.review_decision)}</p><h3>Credential</h3><label class=f>Registration number<input id=reg value="${h(x.c?.registration_number||'')}" ${E?'':'disabled'}></label><label class=f>Expiry<input id=exp type=date value="${h(x.c?.expiry_date||'')}" ${E?'':'disabled'}></label>${E?'<button id=sc class="b b2">Save credential</button>':''}<h3>Certificate</h3><p>${ce.length?'✓ Uploaded':'Missing'}</p>${E?'<input id=cf type=file accept="application/pdf,image/jpeg,image/png"><button id=uc class="b b2">Upload</button>':''}<h3>Display photo</h3><p>${ph.length?'✓ Uploaded':'Missing'}</p>${E?'<input id=pf type=file accept="image/jpeg,image/png"><button id=up class="b b2">Upload</button>':''}<p>${E?'<button id=sync class=b>Submit / recompute</button>':''} ${R?'<button id=ap class=b>Approve</button> <button id=rj class="b b2">Reject</button>':''}</p></div><div class=c><button id=ir class="b b2">Inspection Room</button><h3>Evidence</h3>${x.v.length?x.v.map(z=>`<p><b>${h(z.evidence_type)}</b><br><span class=mut>${h(z.original_filename)}</span></p>`).join(''):'<p class=mut>No evidence.</p>'}<div id=iv></div></div></div></div>`;A('#out').onclick=async()=>{await sb.auth.signOut();login()};A('#ir').onclick=inspect;if(E){A('#sc').onclick=save;A('#uc').onclick=()=>upload('credential_certificate','#cf');A('#up').onclick=()=>upload('display_photo','#pf');A('#sync').onclick=sync}if(R){A('#ap').onclick=()=>review('APPROVED');A('#rj').onclick=()=>review('REJECTED')}}async function save(){let p={tenant_id:x.m.tenant_id,facility_id:x.f.id,clinician_user_id:x.user.id,credential_type:'PMDC',registration_number:A('#reg').value.trim(),expiry_date:A('#exp').value||null,renewal_in_progress:false};let q=x.c?.id?sb.from('credentials').update(p).eq('id',x.c.id):sb.from('credentials').insert(p),{error}=await q;if(error)return note(error.message,'n e');note('Credential saved','n ok');await refresh()}async function upload(t,i){let f=A(i).files?.[0];if(!f)return note('Choose a file','n e');let{data:{session}}=await sb.auth.getSession(),fd=new FormData();fd.append('file',f);fd.append('evidence_type',t);fd.append('requirement_id',x.r.id);let r=await fetch(API+'/upload',{method:'POST',headers:{Authorization:'Bearer '+session.access_token},body:fd}),j=await r.json();if(!r.ok)return note(j.error,'n e');note('Evidence uploaded','n ok');await refresh()}async function sync(){let{data,error}=await sb.rpc('sync_indicator7_state',{target_requirement:x.r.id});if(error)return note(error.message,'n e');note('State: '+data,'n ok');await refresh()}async function review(d){let{error}=await sb.from('facility_requirements').update({review_decision:d}).eq('id',x.r.id);if(error)return note(error.message,'n e');await sync()}async function inspect(){let{data,error}=await sb.from('inspection_indicator7').select('*').eq('facility_requirement_id',x.r.id).single();if(error)return note(error.message,'n e');A('#iv').innerHTML=`<hr><h3>Read-only Inspection Room</h3><p><b>${h(data.indicator_text)}</b></p><p>Status: <span class="st ${h(data.state)}">${h(data.state)}</span></p><p>Certificate evidence: ${data.credential_evidence_count}<br>Display photo: ${data.display_photo_count}<br>Review: ${h(data.review_decision)}</p><small class=mut>This is evidence-readiness, not PHC approval.</small>`}async function refresh(){await load();view()}async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return login();try{await refresh()}catch(e){login();setTimeout(()=>note(e.message,'n e'),0)}}boot();</script></body></html>
