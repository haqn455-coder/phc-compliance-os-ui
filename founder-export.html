<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHC Founder Pilot Export</title><style>body{margin:0;font:15px system-ui;background:#f4f7fb;color:#17212b}.w{max-width:760px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #dde5ee;border-radius:16px;padding:16px;margin:12px 0}.b{border:0;border-radius:10px;padding:11px 14px;background:#173f68;color:white;font-weight:750;margin:5px 5px 5px 0}.b2{background:#e9eff5;color:#17212b}.ok{background:#e7f6ec;padding:10px;border-radius:10px}.warn{background:#fff3d8;padding:10px;border-radius:10px}.mut{color:#657384}pre{white-space:pre-wrap;word-break:break-word;background:#f7f9fc;padding:12px;border-radius:10px;max-height:52vh;overflow:auto}</style></head><body><div class=w><div class=c><h2>PHC Founder Self-Pilot — Export</h2><p class=mut>This page reads the same browser-local pilot data. Nothing is uploaded automatically.</p><div id=status class=warn>Reading local pilot data…</div><p><button id=download class=b>Download Pilot Data (.json)</button><button id=copy class="b b2">Copy Summary</button><button id=back class="b b2">Back to Pilot</button></p></div><div class=c><h3>Summary</h3><pre id=summary></pre></div></div><script>
const KEY='phc_founder_pilot_v01';const raw=localStorage.getItem(KEY);let state={};try{state=raw?JSON.parse(raw):{}}catch{};
const rows=[];let ready=0,action=0,manual=0,na=0,reviewed=0;for(let n=1;n<=47;n++){const s=state[n]?.status||'UNREVIEWED',note=state[n]?.note||'';if(s!=='UNREVIEWED')reviewed++;if(s==='READY')ready++;if(s==='NEEDS_ACTION')action++;if(s==='MANUAL_REVIEW')manual++;if(s==='NOT_APPLICABLE')na++;rows.push({indicator_no:n,status:s,note})}
const payload={pilot_id:'P01',pilot_type:'FOUNDER_SELF',exported_at:new Date().toISOString(),reviewed,ready,needs_action:action,manual_review:manual,not_applicable:na,coverage_percent:Math.round(reviewed/47*100),indicators:rows};
const text=`P01 Founder Self-Pilot\nReviewed: ${reviewed}/47\nReady: ${ready}\nNeeds action: ${action}\nManual review: ${manual}\nNot applicable: ${na}\nCoverage: ${payload.coverage_percent}%\n\n`+rows.map(r=>`Indicator ${r.indicator_no}: ${r.status}${r.note?` | ${r.note}`:''}`).join('\n');
summary.textContent=text;status.className=reviewed?'ok':'warn';status.textContent=reviewed?`Pilot data found: ${reviewed}/47 reviewed.`:'No reviewed pilot data found in this browser.';
download.onclick=()=>{const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PHC_Founder_Pilot_P01_2026-09-01.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(text);status.className='ok';status.textContent='Summary copied. Paste it into ChatGPT.'}catch{status.className='warn';status.textContent='Copy blocked by browser. Select the summary text manually.'}};back.onclick=()=>location.href='./founder-pilot.html';
</script></body></html>
