<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHC Compliance OS</title><style>:root{--ink:#102338;--mut:#66788d;--nav:#0b3558;--blue:#1467a5;--teal:#118a7e;--bg:#eef3f8;--card:#fff;--line:#dce5ee;--green:#e9f8f0;--amber:#fff6df;--red:#fff0ef;--shadow:0 10px 30px rgba(20,50,80,.08)}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}a{color:inherit}.app{max-width:1180px;margin:auto;padding:14px}.top{background:linear-gradient(135deg,#0b3558,#1467a5);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.toprow{display:flex;gap:12px;align-items:flex-start}.brand{font-size:25px;font-weight:850;letter-spacing:-.4px}.sub{opacity:.88;margin-top:4px}.role{display:inline-flex;margin-top:12px;padding:7px 10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:999px;font-weight:700}.logout{margin-left:auto;background:#fff;color:var(--nav);border:0;border-radius:10px;padding:9px 12px;font-weight:800}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:12px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.welcome{background:linear-gradient(135deg,#f8fbff,#edf7ff)}h1,h2,h3{margin:0 0 8px}h2{font-size:20px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.step{background:#fff;border:1px solid #dbe8f3;border-radius:12px;padding:10px}.step b{display:block;color:var(--blue)}.score{display:flex;align-items:center;gap:15px}.ring{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) var(--p),#e4edf3 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;background:white;border-radius:50%}.ring span{z-index:1;font-size:22px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow)}.metric .n{font-size:25px;font-weight:850}.metric .l{color:var(--mut);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;background:var(--nav);color:#fff}.btn.secondary{background:#eaf1f7;color:var(--ink)}.btn.green{background:var(--teal)}.btn.red{background:#a64242}.btn.small{padding:7px 9px;font-size:13px}.registers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.callout{background:var(--amber);border:1px solid #f2dfae;border-radius:12px;padding:11px}.mut{color:var(--mut)}.indicatorHead{display:flex;gap:10px;align-items:center;margin-bottom:12px}.search{flex:1;min-width:180px;border:1px solid #cdd8e3;border-radius:11px;padding:10px 12px;background:#fff}.filter{border:1px solid #cdd8e3;border-radius:11px;padding:10px;background:#fff}.ilist{display:grid;gap:10px}.ind{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 4px 14px rgba(20,50,80,.045)}.indTop{padding:13px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.ino{width:40px;height:40px;border-radius:12px;background:#eaf4fb;color:var(--blue);display:grid;place-items:center;font-weight:850}.ititle{font-weight:780}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef2f6}.chip.ready{background:var(--green);color:#08745f}.chip.review{background:var(--amber);color:#8a6414}.chip.action{background:var(--red);color:#9c3c3c}.chev{border:0;background:#f0f4f8;border-radius:9px;width:34px;height:34px;cursor:pointer}.body{display:none;border-top:1px solid var(--line);padding:13px;background:#fbfdff}.ind.open .body{display:block}.guidegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.box b{display:block;margin-bottom:4px}.evidence{margin-top:10px;background:#f4f9fd;border:1px solid #d8e7f3;border-radius:13px;padding:12px}.drop{border:1.5px dashed #91abc1;border-radius:12px;padding:13px;text-align:center;background:#fff}.drop input{max-width:100%}.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.linkrow input{border:1px solid #cdd8e3;border-radius:9px;padding:9px}.elist{display:grid;gap:6px;margin-top:9px}.efile{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.efile .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reviewbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#102338;color:#fff;padding:11px 14px;border-radius:11px;box-shadow:var(--shadow);display:none;z-index:20}.boundary{margin:14px 0;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--mut);font-size:13px}@media(max-width:800px){.hero,.registers,.guidegrid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.indTop{grid-template-columns:auto 1fr auto}.app{padding:9px}.top{border-radius:16px;padding:16px}.brand{font-size:22px}.indicatorHead{align-items:stretch;flex-direction:column}.toolbar.mobileStack .btn{width:100%}.ring{width:82px;height:82px}.score{justify-content:space-between}}@media(max-width:420px){.metrics{grid-template-columns:1fr 1fr}.metric .n{font-size:22px}}</style></head><body><div class="app" id="app"><div class="card">Loading secure clinic workspace…</div></div><div id="msg" class="msg"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co',KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw';const s=createClient(URL,KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});const LOGIN='https://haqn455-coder.github.io/phc-compliance-os-ui/p01-login.html',REG='https://docs.google.com/spreadsheets/d/1CQuHsM4U-C97JvLcnfBYwj0Pw65-Ca-B6XnIFHou_Nw/edit',GUIDE=REG+'#gid=2119';const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{msg.textContent=t;msg.style.display='block';setTimeout(()=>msg.style.display='none',2800)};function chip(st){const c=st==='READY'?'ready':st==='REVIEW'?'review':st==='NEEDS_ACTION'?'action':'';return `<span class="chip ${c}">${h((st||'NOT_STARTED').replaceAll('_',' '))}</span>`}async function sha256(file){const d=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}function ext(f){return f.type==='application/pdf'?'pdf':f.type==='image/png'?'png':'jpg'}function nextAction(r){if(r.state==='READY')return'Keep evidence current. Recheck after a real change in staff, service, display, expiry, equipment or process.';if(r.state==='REVIEW')return'Review the attached evidence. The owner/reviewer decides whether it is sufficient.';if(r.state==='NEEDS_ACTION')return'Close one real gap, assign responsibility, then attach the proof and send it for review.';return'Confirm applicability, then collect the minimum current evidence that proves the real situation.'}async function load(){const{data:{session}}=await s.auth.getSession();if(!session)return location.replace(LOGIN);const uid=session.user.id;const{data:ms}=await s.from('memberships').select('tenant_id,role').limit(1);if(!ms?.length)return location.replace(LOGIN);const m=ms[0],tid=m.tenant_id;const[{data:ts},{data:fs},{data:fr},{data:defs},{data:support},{data:governed}]=await Promise.all([s.from('tenants').select('name').eq('id',tid).limit(1),s.from('facilities').select('id,name,phc_category').eq('tenant_id',tid).limit(1),s.from('facility_requirements').select('id,requirement_definition_id,state,review_decision,applicable,applicability_reason').eq('tenant_id',tid),s.from('requirement_definitions').select('id,indicator_no,standard_code,indicator_text,evidence_prompt').order('indicator_no'),s.from('indicator_supporting_files').select('id,facility_requirement_id,source_kind,title,original_filename,external_url,mime_type,size_bytes,review_status,created_at').eq('tenant_id',tid).order('created_at',{ascending:false}),s.from('evidence_items').select('id,facility_requirement_id,original_filename,evidence_type,review_decision,uploaded_at').eq('tenant_id',tid).order('uploaded_at',{ascending:false})]);const f=fs?.[0],fm=new Map((fr||[]).map(x=>[x.requirement_definition_id,x])),supMap=new Map(),govMap=new Map();for(const x of support||[]){if(!supMap.has(x.facility_requirement_id))supMap.set(x.facility_requirement_id,[]);supMap.get(x.facility_requirement_id).push(x)}for(const x of governed||[]){if(!govMap.has(x.facility_requirement_id))govMap.set(x.facility_requirement_id,[]);govMap.get(x.facility_requirement_id).push(x)}const rows=(defs||[]).map(d=>({...d,...(fm.get(d.id)||{}),support:supMap.get(fm.get(d.id)?.id)||[],governed:govMap.get(fm.get(d.id)?.id)||[]}));const ready=rows.filter(r=>r.state==='READY').length,review=rows.filter(r=>r.state==='REVIEW').length,action=rows.filter(r=>r.state==='NEEDS_ACTION').length,evidenceCount=rows.reduce((a,r)=>a+r.support.length+r.governed.length,0),pct=Math.round(ready/Math.max(rows.length,1)*100);app.innerHTML=`<section class="top"><div class="toprow"><div><div class="brand">PHC Compliance OS</div><div class="sub">${h(f?.name||ts?.[0]?.name||'Clinic')} · Owner workspace</div><div class="role">Secure role: ${h(m.role)}</div></div><button id="logout" class="logout">Sign out</button></div></section><section class="hero"><div class="card welcome"><h2>Stay inspection-ready without living in paperwork.</h2><p>Use this as a small weekly operating habit: keep evidence where work happens, record real events on the same day, and close one visible gap at a time.</p><div class="steps"><div class="step"><b>1 · Review</b>5 minutes weekly</div><div class="step"><b>2 · Record</b>Real events only</div><div class="step"><b>3 · Prove</b>Attach or link evidence</div></div></div><div class="card score"><div class="ring" style="--p:${pct}%"><span>${pct}%</span></div><div><h3>Readiness snapshot</h3><div class="mut">Human-reviewed READY indicators</div><b>${ready} of ${rows.length}</b></div></div></section><section class="metrics"><div class="metric"><div class="n">${ready}</div><div class="l">Ready</div></div><div class="metric"><div class="n">${review}</div><div class="l">Under review</div></div><div class="metric"><div class="n">${action}</div><div class="l">Needs action</div></div><div class="metric"><div class="n">${evidenceCount}</div><div class="l">Evidence items linked</div></div></section><section class="registers"><div class="card"><h2>Digital Register Centre</h2><p>Use the clinic-owned workbook for operational logs. Enter only real events; training examples stay outside live registers.</p><div class="toolbar mobileStack"><a class="btn" href="${REG}" target="_blank" rel="noopener">Open registers</a><a class="btn secondary" href="${GUIDE}" target="_blank" rel="noopener">Guidance & DEMO examples</a></div></div><div class="card"><h2>Evidence model</h2><div class="callout"><b>Two safe routes:</b><br>Upload PDF/JPEG/PNG to private tenant storage, or paste a Google Drive/Docs/Sheets link. Uploading never auto-declares compliance; evidence goes to human review.</div></div></section><section class="card" style="margin-top:12px"><div class="indicatorHead"><div><h2>47-Indicator Workspace</h2><div class="mut">Search, attach proof, then make a human review decision.</div></div><input id="q" class="search" placeholder="Search indicator, code or words…"><select id="flt" class="filter"><option value="ALL">All</option><option value="NOT_STARTED">Not started</option><option value="REVIEW">Under review</option><option value="NEEDS_ACTION">Needs action</option><option value="READY">Ready</option><option value="NOT_APPLICABLE">Not applicable</option></select></div><div id="ilist" class="ilist">${rows.map(r=>renderIndicator(r,tid,uid,m.role)).join('')}</div></section><div class="boundary"><b>Product boundary:</b> PHC OS organizes readiness, evidence and operational records. It does not grant PHC approval/certification, guarantee inspection outcome, or make autonomous clinical/regulatory decisions.</div>`;logout.onclick=async()=>{await s.auth.signOut();location.replace(LOGIN)};wire(rows,tid,uid,m.role)}function renderIndicator(r,tid,uid,role){const total=r.support.length+r.governed.length;return `<article class="ind" data-state="${h(r.state||'NOT_STARTED')}" data-search="${h((r.standard_code+' '+r.indicator_no+' '+r.indicator_text).toLowerCase())}" id="ind-${r.indicator_no}"><div class="indTop"><div class="ino">${r.indicator_no}</div><div><div class="ititle">${h(r.standard_code)} · ${h(r.indicator_text)}</div><div class="chips">${chip(r.state)}<span class="chip">Review: ${h(r.review_decision||'PENDING')}</span><span class="chip">Evidence: ${total}</span></div></div><button class="chev" data-open="${r.indicator_no}">⌄</button></div><div class="body"><div class="guidegrid"><div class="box"><b>Suggested evidence</b>${h(r.evidence_prompt||'Collect current evidence that directly demonstrates this requirement.')}</div><div class="box"><b>What to do next</b>${h(nextAction(r))}</div></div><div class="evidence"><b>Add supporting evidence</b><p class="mut">Private tenant storage accepts PDF/JPEG/PNG up to 10 MB. Drive links remain in your clinic-owned workspace.</p><div class="drop"><input class="file" data-rid="${r.id}" type="file" accept="application/pdf,image/jpeg,image/png"><div class="mut">Choose one current file. Do not upload unnecessary patient identifiers.</div></div><div class="linkrow"><input class="url" data-rid="${r.id}" placeholder="Paste Google Drive / Docs / Sheets link"><button class="btn secondary small addlink" data-rid="${r.id}">Add link</button></div><div class="elist">${r.support.map(x=>`<div class="efile"><span>${x.source_kind==='drive_link'?'🔗':'📎'}</span><span class="name">${h(x.title||x.original_filename)}</span><span class="chip">${h(x.review_status)}</span>${x.external_url?`<a target="_blank" rel="noopener" href="${h(x.external_url)}">Open</a>`:''}</div>`).join('')}${r.governed.map(x=>`<div class="efile"><span>✅</span><span class="name">${h(x.original_filename)} · ${h(x.evidence_type)}</span><span class="chip">${h(x.review_decision)}</span></div>`).join('')}</div></div>${role==='owner'||role==='reviewer'?`<div class="reviewbar"><button class="btn secondary small mark" data-rid="${r.id}" data-state="NEEDS_ACTION">Needs action</button><button class="btn secondary small mark" data-rid="${r.id}" data-state="REVIEW">Send to review</button><button class="btn green small decide" data-rid="${r.id}" data-decision="APPROVED">Approve → READY</button><button class="btn red small decide" data-rid="${r.id}" data-decision="REJECTED">Reject → Needs action</button></div>`:''}</div></article>`}function wire(rows,tid,uid,role){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>document.getElementById('ind-'+b.dataset.open).classList.toggle('open'));const applyFilter=()=>{const txt=q.value.toLowerCase(),st=flt.value;document.querySelectorAll('.ind').forEach(el=>{el.style.display=(el.dataset.search.includes(txt)&&(st==='ALL'||el.dataset.state===st))?'':'none'})};q.oninput=applyFilter;flt.onchange=applyFilter;document.querySelectorAll('.file').forEach(inp=>inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return;if(f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type)){toast('PDF/JPEG/PNG only, max 10 MB');inp.value='';return}inp.disabled=true;try{const hash=await sha256(f),path=`${tid}/supporting/${inp.dataset.rid}/${hash}.${ext(f)}`;const up=await s.storage.from('phc-evidence').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;const ins=await s.from('indicator_supporting_files').insert({tenant_id:tid,facility_requirement_id:inp.dataset.rid,source_kind:'upload',title:f.name,storage_path:path,original_filename:f.name,mime_type:f.type,size_bytes:f.size,sha256:hash,uploaded_by:uid});if(ins.error){await s.storage.from('phc-evidence').remove([path]);throw ins.error}await s.from('facility_requirements').update({state:'REVIEW',review_decision:'PENDING'}).eq('id',inp.dataset.rid);toast('Evidence uploaded and sent for human review');await load()}catch(e){toast(e.message||'Upload failed')}finally{inp.disabled=false}});document.querySelectorAll('.addlink').forEach(b=>b.onclick=async()=>{const input=document.querySelector(`.url[data-rid="${b.dataset.rid}"]`),url=input.value.trim();if(!/^https:\/\/(drive|docs)\.google\.com\//i.test(url)){toast('Use a Google Drive / Docs / Sheets link');return}b.disabled=true;const ins=await s.from('indicator_supporting_files').insert({tenant_id:tid,facility_requirement_id:b.dataset.rid,source_kind:'drive_link',title:'Clinic Drive evidence',external_url:url,uploaded_by:uid});if(ins.error){toast(ins.error.message);b.disabled=false;return}await s.from('facility_requirements').update({state:'REVIEW',review_decision:'PENDING'}).eq('id',b.dataset.rid);toast('Drive evidence linked and sent for review');await load()});document.querySelectorAll('.mark').forEach(b=>b.onclick=async()=>{const u=await s.from('facility_requirements').update({state:b.dataset.state,review_decision:'PENDING'}).eq('id',b.dataset.rid);if(u.error)return toast(u.error.message);toast('Indicator status updated');await load()});document.querySelectorAll('.decide').forEach(b=>b.onclick=async()=>{const approved=b.dataset.decision==='APPROVED',u=await s.from('facility_requirements').update({state:approved?'READY':'NEEDS_ACTION',review_decision:b.dataset.decision}).eq('id',b.dataset.rid);if(u.error)return toast(u.error.message);toast(approved?'Human review approved — indicator READY':'Human review rejected — needs action');await load()})}load();</script></body></html>
