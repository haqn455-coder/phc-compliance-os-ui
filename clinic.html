 document.querySelectorAll('.ind').forEach(el=>{const id=el.dataset.id,r=state.rows.find(x=>x.id===id);el.querySelector('.sit').onchange=e=>{const m=state.meta[id]||{};state.meta[id]={...m,situation:e.target.value};saveLS(metaKey(),state.meta);render()};el.querySelector('.note').onchange=e=>{const m=state.meta[id]||{};state.meta[id]={...m,note:e.target.value};saveLS(metaKey(),state.meta);render()};el.querySelector('.reviewed').onchange=e=>{const m=state.meta[id]||{};state.meta[id]={...m,reviewed:e.target.checked};saveLS(metaKey(),state.meta);render()};el.querySelector('.addEv').onclick=async e=>{e.preventDefault();const input=el.querySelector('.filein'),files=[...(input.files||[])];for(const file of files){await idbPut({id:crypto.randomUUID(),tenantReq:state.tenantId+'|'+id,tenantId:state.tenantId,requirementId:id,name:file.name,type:file.type,size:file.size,blob:file,createdAt:new Date().toISOString()})}await refreshFiles();render()};el.querySelectorAll('.evremove').forEach(b=>b.onclick=async()=>{await idbDel(b.dataset.id);await refreshFiles();render()})});
 const ro=document.getElementById('regs'),or=document.getElementById('openRegs');if(ro)ro.onclick=showRegisters;if(or)or.onclick=showRegisters;
 const bk=document.getElementById('backup');if(bk)bk.onclick=exportLocalBackup;const rs=document.getElementById('restore'),rf=document.getElementById('restoreFile');if(rs&&rf){rs.onclick=()=>rf.click();rf.onchange=async()=>{const file=rf.files?.[0];rf.value='';if(file)await restoreLocalBackup(file)}}
 const ex=document.getElementById('export');if(ex)ex.onclick=exportSummary;const pr=document.getElementById('print');if(pr)pr.onclick=()=>print();const out=document.getElementById('out');if(out)out.onclick=async()=>{await s.auth.signOut();location.replace(LOGIN)}
}
function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',')[1]||'');r.onerror=()=>reject(r.error||new Error('Could not read evidence file'));r.readAsDataURL(blob)})}
function base64ToBlob(base64,type){const bin=atob(base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:type||'application/octet-stream'})}
async function exportLocalBackup(){
 const files=await idbListTenant(state.tenantId),evidence=[];
 for(const f of files)evidence.push({id:f.id,requirementId:f.requirementId,name:f.name,type:f.type,size:f.size,createdAt:f.createdAt,data_base64:await blobToBase64(f.blob)});
 const payload={schema:'PHCOS_LOCAL_BACKUP_V1',tenant_id:state.tenantId,clinic:state.clinic,exported_at:new Date().toISOString(),indicator_meta:state.meta||{},registers:ls(regKey(),[]),evidence};
 const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PHC-OS-Local-Backup-'+day()+'.json';a.click();URL.revokeObjectURL(a.href)
}
async function restoreLocalBackup(file){
 try{
  const backup=JSON.parse(await file.text());
  if(backup?.schema!=='PHCOS_LOCAL_BACKUP_V1')throw new Error('This is not a PHC OS local backup file.');
  if(backup.tenant_id!==state.tenantId)throw new Error('Backup belongs to a different clinic/tenant. Restore blocked.');
  if(!confirm('Restore this backup into the current clinic? Existing local data will be preserved where possible.'))return;
  state.meta={...(state.meta||{}),...(backup.indicator_meta||{})};saveLS(metaKey(),state.meta);
  const current=ls(regKey(),[]),byId=new Map(current.filter(x=>x?.id).map(x=>[x.id,x]));for(const x of backup.registers||[])if(x?.id)byId.set(x.id,x);saveLS(regKey(),[...byId.values()]);
  for(const e of backup.evidence||[]){if(!e?.id||!e?.requirementId||!e?.data_base64)continue;const blob=base64ToBlob(e.data_base64,e.type);await idbPut({id:e.id,tenantReq:state.tenantId+'|'+e.requirementId,tenantId:state.tenantId,requirementId:e.requirementId,name:e.name||'evidence',type:e.type||blob.type,size:e.size||blob.size,blob,createdAt:e.createdAt||new Date().toISOString()})}
  await refreshFiles();render();alert('PHC OS backup restored successfully for this clinic.')
 }catch(err){alert(err instanceof Error?err.message:'Could not restore backup.')}
}
function exportSummary(){const rows=state.rows.map(r=>({indicator:r.indicator_no,standard:r.standard_code,requirement:r.indicator_text,status:calcStatus(r),situation:state.meta[r.id]?.situation||'applicable',note:state.meta[r.id]?.note||'',evidence_files:state.files[r.id]?.length||0}));const blob=new Blob([JSON.stringify({clinic:state.clinic,tenant_id:state.tenantId,exported_at:new Date().toISOString(),indicators:rows},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PHC-Inspection-Summary-'+day()+'.json';a.click();URL.revokeObjectURL(a.href)}
function showRegisters(){modal.innerHTML=`<div class="overlay"><div class="sheet"><div class="sheetin"><div class="toolbar"><div class="grow"><div class="mut" style="font-weight:800">19 IN-APP REGISTERS</div><h2 style="margin:0">Master Registers Hub</h2><div class="mut">Routine logging stays inside the clinic workspace.</div></div><button id="closeM" class="btn secondary">✕</button></div>${Object.keys(CAT).map(c=>`<section class="cat"><div class="cathead"><span class="catletter">${c}</span><h3 style="margin:0">${CAT[c]}</h3></div><div class="reggrid">${REG.filter(r=>r[3]===c).map((r,i)=>`<button class="regcard" data-key="${r[0]}"><b>${h(r[1])}</b><div class="mut">${h(r[2])}</div></button>`).join('')}</div></section>`).join('')}</div></div></div>`;document.getElementById('closeM').onclick=()=>modal.innerHTML='';document.querySelectorAll('.regcard').forEach(b=>b.onclick=()=>showRegister(b.dataset.key))}
function showRegister(key){const cfg=REG.find(r=>r[0]===key),v=regDef(state.tenantId,key),fs=fields[key]||[];modal.innerHTML=`<div class="overlay"><div class="sheet"><form id="rf" class="sheetin"><div class="toolbar"><button type="button" id="backM" class="btn secondary">‹ Back to Registers</button><div class="grow"><div class="mut" style="font-weight:800">${h(cfg[2])}</div><h2 style="margin:0">${h(cfg[1])}</h2></div><button type="button" id="closeM" class="btn secondary">✕</button></div><div id="ok"></div><div class="formgrid" style="margin-top:16px">${fs.map(f=>{const [k,l,t,opts]=f,val=v[k]??'';if(t==='textarea')return`<label class="field" style="grid-column:1/-1">${h(l)}<textarea name="${k}" required>${h(val)}</textarea></label>`;if(t==='select')return`<label class="field">${h(l)}<select name="${k}" required>${opts.split('|').map(o=>`<option ${o===val?'selected':''}>${h(o)}</option>`).join('')}</select></label>`;return`<label class="field">${h(l)}<input name="${k}" type="${t||'text'}" value="${h(val)}" ${k==='referenceId'||k==='serial'||k==='token'?'readonly':''} required></label>`}).join('')}</div>${key==='Medicine_Temperature'?'<div class="guide" style="margin-top:10px"><b id="tempStatus">Normal (Safe)</b> · Accepted cold-chain range shown here: 2°C–8°C.</div>':''}<div class="boundary" style="margin-top:12px">Use a case/token ID where possible. Do not enter unnecessary patient-identifiable information into operational logs.</div><div style="text-align:right;margin-top:14px"><button id="saveR" class="btn">Save Entry</button></div></form></div></div>`;document.getElementById('backM').onclick=showRegisters;document.getElementById('closeM').onclick=()=>modal.innerHTML='';if(key==='Medicine_Temperature'){const inp=document.querySelector('[name=temperature]'),st=document.getElementById('tempStatus');inp.oninput=()=>{const n=Number(inp.value);st.textContent=n>=2&&n<=8?'Normal (Safe)':'Outside safe range';st.style.color=n>=2&&n<=8?'#08745f':'#9c3c3c'}}document.getElementById('rf').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('saveR');btn.disabled=true;btn.textContent='Saving…';await new Promise(r=>setTimeout(r,400));const values=Object.fromEntries(new FormData(e.currentTarget).entries()),entries=ls(regKey(),[]);let clinicAI=null;if(key==='Patient_Service_Pathway')clinicAI={'Source Form':'PHC_OS_REGISTER','Received At':new Date().toISOString(),'Case ID':values.token||'','Patient Name':values.patientName||'','Phone':values.phone||'','Age':values.age||'','Sex':values.gender||'','Visit Type':values.servicePathway||'','Complaint Raw Text':'','Complaint Normalized Bucket':'','Duration':'','Key Associated Symptoms':'','PMH':'','PSH':'','Current Medicines Raw':'','Drug Allergy/Reaction':'','Family History':'','Prior Tests Summary':'','Pregnancy Context if relevant':'','Patient Notes':values.dispositionNotes||'','Intake Completeness':'PARTIAL_REGISTER','Clinical Stage':'REGISTERED'};entries.push({id:crypto.randomUUID(),key,tenantId:state.tenantId,values,clinicAICaseRegistry:clinicAI,savedAt:new Date().toISOString(),actor:state.user?.email||''});saveLS(regKey(),entries);document.getElementById('ok').innerHTML='<div class="banner ok" style="margin-top:12px">✓ Entry logged successfully to this clinic’s device-local register.</div>';setTimeout(()=>{modal.innerHTML=''},700)}}
function renderLoadFailure(error){console.error('PHC OS clinic bootstrap failed',error);app.innerHTML='<div class="card"><h2>Clinic workspace could not finish loading</h2><p class="mut">'+h(error?.message||'The secure clinic data request did not complete.')+'</p><p class="mut">No clinic data was changed. Retry once; if the account is wrong, switch accounts safely.</p><div class="toolbar"><button id="retryLoad" class="btn">Retry workspace</button><button id="switchLoad" class="btn secondary">Sign out / switch account</button></div></div>';document.getElementById('retryLoad').onclick=()=>location.reload();document.getElementById('switchLoad').onclick=async()=>{try{await withTimeout(s.auth.signOut(),'Sign out',8000)}finally{location.replace(LOGIN+'?switch=1')}}}
function renderInvalidAuthLink(){app.innerHTML='<div class="card"><h2>This sign-in link is invalid or has expired</h2><p class="mut">PHC OS blocked fallback to any clinic already signed in on this browser. Request a fresh tenant-bound link or switch to the intended clinic account.</p><div class="toolbar"><a class="btn" href="'+LOGIN+'">Request a new sign-in link</a><button id="switchInvalid" class="btn secondary">Sign out / switch account</button></div></div>';document.getElementById('switchInvalid').onclick=async()=>{try{await withTimeout(s.auth.signOut(),'Sign out',8000)}finally{location.replace(LOGIN+'?switch=1')}}}
function renderAccessCard(session,error,forced){const inactive=/not active|suspended|closed|trial has ended/i.test(error?.message||''),title=/trial has ended/i.test(error?.message||'')?'Your trial has ended':inactive?'Clinic access is not active':'This link belongs to another clinic';app.innerHTML='<div class="card"><h2>'+title+'</h2><p class="mut">'+h(error?.message||'The signed-in account is not assigned to this clinic.')+'</p><p class="mut">Signed in as <b>'+h(session.user.email||'another clinic user')+'</b>. PHC OS will not silently open a different tenant.</p><div class="toolbar"><button id="mine" class="btn">Open my assigned clinic</button><button id="switch" class="btn secondary">Sign out / switch account</button></div></div>';document.getElementById('mine').onclick=()=>location.replace(new URL('clinic.html',APP_ROOT));document.getElementById('switch').onclick=async()=>{await s.auth.signOut();const u=new URL(LOGIN);if(forced)u.searchParams.set('tenant',forced);u.searchParams.set('switch','1');location.replace(u)}}
function renderSessionFailure(error){app.innerHTML='<div class="card"><h2>Access unavailable</h2><p>'+h(error?.message||'Clinic access could not be verified.')+'</p><div class="toolbar"><button id="retryAccess" class="btn">Retry</button><button id="switchAccess" class="btn secondary">Sign out / switch account</button></div></div>';document.getElementById('retryAccess').onclick=()=>location.reload();document.getElementById('switchAccess').onclick=async()=>{await s.auth.signOut();location.replace(LOGIN+'?switch=1')}}
async function loadSecure(){try{
 if(authLinkError){renderInvalidAuthLink();return}
 const auth=await withTimeout(s.auth.getSession(),'Secure session check'),session=auth?.data?.session;
 if(!session){const login=new URL(LOGIN),forcedTenant=pageUrl.searchParams.get('tenant'),pilot=pageUrl.searchParams.get('pilot');if(forcedTenant)login.searchParams.set('tenant',forcedTenant);if(pilot)login.searchParams.set('pilot',pilot);location.replace(login);return}
 state.user=session.user;
 const adminResult=await withTimeout(s.from('platform_admins').select('user_id').eq('user_id',session.user.id).maybeSingle(),'Account role check'),isAdmin=!!checked(adminResult,'Account role check'),forced=pageUrl.searchParams.get('tenant')||'';
 let tid='',mem=null,preview=null;
 if(forced){
  if(isAdmin){preview=await adminPreview(session,forced);tid=forced;mem={role:'platform_admin'}}
  else{try{const opened=await sessionOpen(session,forced);tid=opened.tenant_id;mem={role:opened.role}}catch(error){renderAccessCard(session,error,forced);return}}
 }else{
  if(isAdmin){location.replace(APP_ROOT);return}
  try{const opened=await sessionOpen(session);tid=opened.tenant_id;mem={role:opened.role}}catch(error){renderSessionFailure(error);return}
 }
 let t,f,fr,d;
 if(preview){t=preview.tenant;f=preview.facility?[preview.facility]:[];fr=preview.requirements||[];d=preview.definitions||[]}
 else{const results=await Promise.all([withTimeout(s.from('tenants').select('name').eq('id',tid).maybeSingle(),'Clinic profile'),withTimeout(s.from('facilities').select('id,name,phc_category').eq('tenant_id',tid).limit(1),'Facility profile'),withTimeout(s.from('facility_requirements').select('id,requirement_definition_id,state,review_decision,applicable,applicability_reason').eq('tenant_id',tid),'Clinic indicators'),withTimeout(s.from('requirement_definitions').select('id,indicator_no,standard_code,indicator_text,evidence_prompt').eq('is_active',true).order('indicator_no'),'Indicator definitions')]);t=checked(results[0],'Clinic profile');f=checked(results[1],'Facility profile');fr=checked(results[2],'Clinic indicators');d=checked(results[3],'Indicator definitions')}
 if(!t||!f?.length)throw new Error('The selected clinic profile is incomplete.');
 if((d||[]).length!==47||(fr||[]).length!==47)throw new Error('Clinic requirement integrity check failed: expected 47 indicators.');
 const fm=new Map((fr||[]).map(x=>[x.requirement_definition_id,x]));state.tenantId=tid;state.clinic=f[0]?.name||t.name||'Clinic';state.role=mem?.role||(isAdmin?'platform_admin':'viewer');state.rows=(d||[]).map(x=>({...x,...(fm.get(x.id)||{}),id:(fm.get(x.id)||{}).id||x.id}));state.meta=ls(metaKey(),{});state.storageWarning='';
 try{await refreshFiles()}catch(error){state.files={};for(const row of state.rows)state.files[row.id]=[];state.storageWarning=error?.message||'Device-local evidence storage is unavailable.';console.warn('PHC OS evidence storage unavailable',error)}
 render();
 if(state.storageWarning){const banner=document.createElement('div');banner.className='boundary';banner.textContent='Evidence storage is temporarily unavailable on this device. The workspace remains usable, but file attachments are disabled until storage recovers. '+state.storageWarning;app.prepend(banner)}
}catch(error){renderLoadFailure(error)}}
