<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PHC Compliance OS — Clinic</title><style>:root{--ink:#102338;--mut:#66788d;--nav:#0b3558;--blue:#1467a5;--teal:#118a7e;--bg:#eef3f8;--line:#dce5ee;--green:#e9f8f0;--amber:#fff6df;--red:#fff0ef}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{max-width:1080px;margin:auto;padding:12px}.top{background:linear-gradient(135deg,var(--nav),var(--blue));color:#fff;border-radius:20px;padding:18px}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.logout{margin-left:auto;border:0;border-radius:9px;padding:9px 11px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.m{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.n{font-size:24px;font-weight:850}.mut{color:var(--mut)}.ilist{display:grid;gap:9px}.ind{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.head{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:12px;cursor:pointer}.ino{width:38px;height:38px;border-radius:10px;background:#eaf4fb;color:var(--blue);display:grid;place-items:center;font-weight:850}.body{display:none;border-top:1px solid var(--line);padding:12px;background:#fbfdff}.ind.open .body{display:block}.chip{display:inline-block;border-radius:999px;padding:4px 7px;background:#eef2f6;font-size:11px;font-weight:800;margin:4px 4px 0 0}.ready{background:var(--green);color:#08745f}.review{background:var(--amber);color:#8a6414}.action{background:var(--red);color:#9c3c3c}.guide{background:#f4f9fd;border:1px solid #d8e7f3;border-radius:10px;padding:10px;margin-top:8px}.search{width:100%;padding:10px;border:1px solid #ccd8e3;border-radius:10px;margin-top:8px}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}.app{padding:8px}}</style></head><body><main id=app class=app><div class=card>Loading secure clinic workspace…</div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://auzbkudpqdmrgyxtwaiy.supabase.co',KEY='sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw';const s=createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});const LOGIN='https://haqn455-coder.github.io/phc-compliance-os-ui/p01-login.html';const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cls(st){return st==='READY'?'ready':st==='REVIEW'?'review':st==='NEEDS_ACTION'?'action':''}async function load(){const{data:{session}}=await s.auth.getSession();if(!session)return location.replace(LOGIN);const uid=session.user.id;const{data:ms}=await s.from('memberships').select('tenant_id,role,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(1);if(!ms?.length){app.innerHTML='<div class=card>No active clinic access is assigned to this email.</div>';return}const m=ms[0],tid=m.tenant_id;const[{data:t},{data:f},{data:fr},{data:d}]=await Promise.all([s.from('tenants').select('name').eq('id',tid).single(),s.from('facilities').select('id,name,phc_category').eq('tenant_id',tid).limit(1),s.from('facility_requirements').select('id,requirement_definition_id,state,review_decision,applicable,applicability_reason').eq('tenant_id',tid),s.from('requirement_definitions').select('id,indicator_no,standard_code,indicator_text,evidence_prompt').eq('is_active',true).order('indicator_no')]);const fm=new Map((fr||[]).map(x=>[x.requirement_definition_id,x]));const rows=(d||[]).map(x=>({...x,...(fm.get(x.id)||{})}));const ready=rows.filter(x=>x.state==='READY').length,review=rows.filter(x=>x.state==='REVIEW').length,action=rows.filter(x=>x.state==='NEEDS_ACTION').length;app.innerHTML=`<section class=top><div class=row><div><h1 style="margin:0">PHC Compliance OS</h1><div style="opacity:.86">${h(f?.[0]?.name||t?.name||'Clinic')}</div><div style="margin-top:8px;font-weight:750">Role: ${h(m.role)}</div></div><button id=out class=logout>Sign out</button></div></section><section class=metrics><div class=m><div class=n>${ready}</div><div class=mut>Ready</div></div><div class=m><div class=n>${review}</div><div class=mut>Under review</div></div><div class=m><div class=n>${action}</div><div class=mut>Needs action</div></div><div class=m><div class=n>${rows.length}</div><div class=mut>Indicators</div></div></section><section class=card><h2 style="margin:0">Your 47-indicator workspace</h2><p class=mut>Use current real evidence. Upload/review controls are enabled progressively; final compliance judgment remains human-controlled.</p><input id=q class=search placeholder="Search indicator or keyword"><div id=ilist class=ilist style="margin-top:10px">${rows.map(r=>`<article class=ind data-search="${h((r.standard_code+' '+r.indicator_no+' '+r.indicator_text).toLowerCase())}"><div class=head><div class=ino>${r.indicator_no}</div><div><b>${h(r.standard_code)} · ${h(r.indicator_text)}</b><div><span class="chip ${cls(r.state)}">${h((r.state||'NOT_STARTED').replaceAll('_',' '))}</span><span class=chip>Review: ${h(r.review_decision||'PENDING')}</span></div></div><div>▾</div></div><div class=body><div class=guide><b>Suggested evidence</b><br>${h(r.evidence_prompt||'Collect current evidence that directly supports this requirement.')}</div><div class=guide><b>How to use</b><br>Confirm whether the requirement applies to your actual clinic service, keep evidence current, and do not create dummy records merely to make a status appear complete.</div></div></article>`).join('')}</div></section><section class=card><b>Boundary:</b> PHC OS helps organize evidence, readiness and operational records. It does not grant PHC approval/certification or guarantee an inspection/licensing outcome.</section>`;document.querySelectorAll('.head').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));q.oninput=()=>{const z=q.value.toLowerCase();document.querySelectorAll('.ind').forEach(x=>x.style.display=x.dataset.search.includes(z)?'':'none')};out.onclick=async()=>{await s.auth.signOut();location.replace(LOGIN)}}load();</script></body></html>
