or.message||'').toLowerCase();if(t.includes('rate limit')){msg.className='warn';msg.textContent='Sign-in email temporarily paused by the development mail sender. Do not keep pressing the button. Use the newest email already received, or retry after the mail window resets. Production pilots will use a branded SMTP sender.'}else{msg.className='er';msg.textContent=error.message}}else{msg.className='ok';msg.textContent='New sign-in link sent. Open the newest email; older localhost links are invalid.'}}</script></body></html>
