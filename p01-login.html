<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PHC OS Sign in</title>
  <style>body{font:16px system-ui;background:#f4f7fb;color:#17212b;margin:0}.w{max-width:520px;margin:40px auto;padding:16px}.c{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:18px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5df;border-radius:9px}button{margin-top:12px;padding:12px 14px;border:0;border-radius:9px;background:#173f68;color:#fff;font-weight:700}.m{color:#657384}.ok{background:#e7f6ec;padding:10px;border-radius:9px;margin-top:12px}.er{background:#fdeaea;padding:10px;border-radius:9px;margin-top:12px}.warn{background:#fff3d8;padding:10px;border-radius:9px;margin-top:12px}</style>
</head>
<body>
<div class="w"><div class="c"><h2>PHC Compliance OS</h2><p class="m">Private owner sign-in</p><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="your invited email"><button id="go">Send secure sign-in link</button><div id="msg"></div></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const s=createClient('https://auzbkudpqdmrgyxtwaiy.supabase.co','sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw',{auth:{detectSessionInUrl:true,persistSession:true}});
const ROOT='https://haqn455-coder.github.io/phc-compliance-os-ui/';
const portal=ROOT,params=new URL(location.href).searchParams,targetTenant=params.get('tenant')||'',targetPilot=params.get('pilot')||'';
const clinicUrl=new URL('clinic.html',ROOT);if(targetTenant)clinicUrl.searchParams.set('tenant',targetTenant);if(targetPilot)clinicUrl.searchParams.set('pilot',targetPilot);
const loginUrl=new URL('p01-login.html',ROOT);if(targetTenant)loginUrl.searchParams.set('tenant',targetTenant);if(targetPilot)loginUrl.searchParams.set('pilot',targetPilot);
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function accountCard(session){msg.className='warn';msg.innerHTML='Currently signed in as <b>'+h(session.user.email||'clinic user')+'</b>.<br><button id="openClinic" style="margin-right:8px">Open my clinic</button><button id="switchAccount">Sign out & switch account</button>';openClinic.onclick=()=>location.replace(new URL('clinic.html',ROOT));switchAccount.onclick=async()=>{await s.auth.signOut();location.reload()}}
const {data:{session}}=await s.auth.getSession();
if(session){
  const a=await s.from('platform_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  if(a.data){location.replace(targetTenant?clinicUrl:portal)}
  else if(targetTenant){
    const own=await s.from('memberships').select('tenant_id').eq('user_id',session.user.id).eq('tenant_id',targetTenant).maybeSingle();
    if(own.data){location.replace(clinicUrl)}
    else{msg.className='warn';msg.innerHTML='This link belongs to another clinic. You are signed in as <b>'+h(session.user.email||'another clinic user')+'</b>.<br><button id="openClinic" style="margin-right:8px">Open my assigned clinic</button><button id="switchAccount">Sign out / switch account</button>';openClinic.onclick=()=>location.replace(new URL('clinic.html',ROOT));switchAccount.onclick=async()=>{await s.auth.signOut();location.reload()}}
  }else accountCard(session)
}
go.onclick=async()=>{go.disabled=true;msg.className='';msg.textContent='Sending…';const e=email.value.trim();if(!e){go.disabled=false;msg.className='er';msg.textContent='Enter your invited email.';return}const{error}=await s.auth.signInWithOtp({email:e,options:{shouldCreateUser:true,emailRedirectTo:targetTenant?clinicUrl.toString():loginUrl.toString()}});go.disabled=false;if(error){const t=(error.message||'').toLowerCase();if(t.includes('rate limit')){msg.className='warn';msg.textContent='Sign-in email is temporarily rate-limited. Do not keep pressing the button; use the newest email already received or retry after the mail window resets.'}else{msg.className='er';msg.textContent=error.message}}else{msg.className='ok';msg.textContent='New sign-in link sent. Open the newest email; older or already-used links are invalid.'}}
</script>
</body>
</html>
