name: PHC GP Readiness Snapshot Test
on:
  push:
    paths:
      - 'product/gp_readiness_snapshot_v0_1.json'
      - 'product/gp_readiness_snapshot_eval.mjs'
      - 'product/gp_readiness_snapshot_eval.test.mjs'
      - 'product/gp_snapshot_form_logic.mjs'
      - 'product/gp_snapshot_form_logic.test.mjs'
      - 'product/gp_snapshot_ops_logic.mjs'
      - 'product/gp_snapshot_ops_logic.test.mjs'
      - 'product/gp_snapshot_ops_ui.js'
      - 'index.html'
      - '.github/workflows/phc-gp-readiness-snapshot-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic snapshot evaluator tests
        run: node product/gp_readiness_snapshot_eval.test.mjs
      - name: Run snapshot form and privacy tests
        run: node product/gp_snapshot_form_logic.test.mjs
      - name: Run snapshot operations logic/source tests
        run: node product/gp_snapshot_ops_logic.test.mjs
