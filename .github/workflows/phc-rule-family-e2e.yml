name: PHC Rule Family E2E
on:
  push:
    paths:
      - '.github/workflows/phc-rule-family-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-proof:
    runs-on: ubuntu-latest
    env:
      BASE: https://auzbkudpqdmrgyxtwaiy.supabase.co
      KEY: sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw
      ORIGIN: https://haqn455-coder.github.io
      TENANT_A: 10000000-0000-0000-0000-000000000001
      TENANT_B: 20000000-0000-0000-0000-000000000002
    steps:
      - name: Obtain synthetic sessions
        shell: bash
        run: |
          set -euo pipefail
          for P in ownerA reviewerA viewerA ownerB; do
            BODY=$(curl -sS --fail-with-body -H "Origin: $ORIGIN" "$BASE/functions/v1/phc-api/test-session?persona=$P")
            TOKEN=$(printf '%s' "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True; print(d['access_token'])")
            NAME=$(printf '%s' "$P" | tr '[:lower:]' '[:upper:]')
            echo "${NAME}_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          done

      - name: Discover representative requirements
        shell: bash
        run: |
          set -euo pipefail
          D=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/requirement_definitions?select=id,indicator_no&vertical_code=eq.GP_2017&indicator_no=in.(1,14,29,32,47)")
          F=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/facility_requirements?select=id,requirement_definition_id&tenant_id=eq.$TENANT_A")
          printf '%s' "$D" > defs.json; printf '%s' "$F" > frs.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          ds=json.load(open('defs.json')); fs=json.load(open('frs.json'))
          m={d['id']:d['indicator_no'] for d in ds}; o={m[f['requirement_definition_id']]:f['id'] for f in fs if f['requirement_definition_id'] in m}
          assert set(o)=={1,14,29,32,47},o
          for n in sorted(o): print(f'I{n}={o[n]}')
          PY
          DID1=$(printf '%s' "$D" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(x['id'] for x in d if x['indicator_no']==1))")
          B=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERB_TOKEN" "$BASE/rest/v1/facility_requirements?select=id&tenant_id=eq.$TENANT_B&requirement_definition_id=eq.$DID1")
          I1B=$(printf '%s' "$B" | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d)==1,d; print(d[0]['id'])")
          echo "I1B=$I1B" >> "$GITHUB_ENV"

      - name: Helper files
        shell: bash
        run: |
          set -euo pipefail
          printf 'synthetic-%s-%s-a' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > a.pdf
          printf 'synthetic-%s-%s-b' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > b.pdf
          printf 'synthetic-%s-%s-c' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > c.pdf
          printf 'synthetic-%s-%s-d' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > d.pdf
          printf 'synthetic-%s-%s-e' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > e.pdf
          printf 'synthetic-%s-%s-f' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > f.pdf

      - name: STATIC family Indicator 1
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"applicable":true,"applicability_reason":null,"review_decision":"PENDING"}' "$BASE/rest/v1/facility_requirements?id=eq.$I1"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I1\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='NEEDS_ACTION'"
          CODE=$(curl -sS -o bad.json -w '%{http_code}' -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I1" -F 'evidence_type=undeclared_evidence' -F 'file=@a.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload")
          test "$CODE" = "400"
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I1" -F 'evidence_type=signboard_photo' -F 'file=@a.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I1\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $REVIEWERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"review_decision":"APPROVED"}' "$BASE/rest/v1/facility_requirements?id=eq.$I1"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $REVIEWERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I1\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='READY'"
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I1" -F 'evidence_type=signboard_photo' -F 'file=@b.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          R=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/facility_requirements?select=review_decision&id=eq.$I1")
          printf '%s' "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d[0]['review_decision']=='PENDING',d"
          echo 'STATIC family PASS'

      - name: N-A family Indicator 14
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"applicable":false,"applicability_reason":"Synthetic Gate family proof: no staff requiring performance evaluation","review_decision":"PENDING"}' "$BASE/rest/v1/facility_requirements?id=eq.$I14"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I14\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $REVIEWERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"review_decision":"APPROVED"}' "$BASE/rest/v1/facility_requirements?id=eq.$I14"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $REVIEWERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I14\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='NOT_APPLICABLE'"
          echo 'N/A family PASS'

      - name: EVENT family Indicator 29
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"applicable":true,"applicability_reason":null,"review_decision":"PENDING"}' "$BASE/rest/v1/facility_requirements?id=eq.$I29"
          curl -sS --fail-with-body -X DELETE -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Prefer: return=minimal' "$BASE/rest/v1/facility_requirement_facts?facility_requirement_id=eq.$I29&fact_key=eq.referral_occurred"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I29\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='NEEDS_ACTION'"
          curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "{\"tenant_id\":\"$TENANT_A\",\"facility_requirement_id\":\"$I29\",\"fact_key\":\"referral_occurred\",\"fact_value\":false}" "$BASE/rest/v1/facility_requirement_facts?on_conflict=facility_requirement_id,fact_key"
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I29" -F 'evidence_type=referral_sop' -F 'file=@c.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I29\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $REVIEWERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"review_decision":"APPROVED"}' "$BASE/rest/v1/facility_requirements?id=eq.$I29"
          curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "{\"tenant_id\":\"$TENANT_A\",\"facility_requirement_id\":\"$I29\",\"fact_key\":\"referral_occurred\",\"fact_value\":true}" "$BASE/rest/v1/facility_requirement_facts?on_conflict=facility_requirement_id,fact_key"
          R=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/facility_requirements?select=review_decision&id=eq.$I29")
          printf '%s' "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d[0]['review_decision']=='PENDING',d"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I29\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='NEEDS_ACTION'"
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I29" -F 'evidence_type=referral_record_sample' -F 'file=@d.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I29\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          echo 'EVENT family PASS'

      - name: SERVICE family Indicator 32
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "{\"tenant_id\":\"$TENANT_A\",\"facility_requirement_id\":\"$I32\",\"fact_key\":\"home_visit_provided\",\"fact_value\":true}" "$BASE/rest/v1/facility_requirement_facts?on_conflict=facility_requirement_id,fact_key"
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I32" -F 'evidence_type=home_visit_policy_display' -F 'file=@e.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I32\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='NEEDS_ACTION'"
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I32" -F 'evidence_type=home_visit_process_evidence' -F 'file=@f.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I32\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          echo 'SERVICE family PASS'

      - name: MULTI DOMAIN family Indicator 47
        shell: bash
        run: |
          set -euo pipefail
          for K in instrument_processing_performed ppe_required; do
            curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "{\"tenant_id\":\"$TENANT_A\",\"facility_requirement_id\":\"$I47\",\"fact_key\":\"$K\",\"fact_value\":false}" "$BASE/rest/v1/facility_requirement_facts?on_conflict=facility_requirement_id,fact_key"
          done
          for T in infection_control_sop environmental_cleaning_evidence hand_hygiene_evidence healthcare_waste_evidence; do
            printf 'multi-%s-%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$T" > multi.pdf
            curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I47" -F "evidence_type=$T" -F 'file=@multi.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          done
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I47\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          curl -sS --fail-with-body -X PATCH -H "apikey: $KEY" -H "Authorization: Bearer $REVIEWERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d '{"review_decision":"APPROVED"}' "$BASE/rest/v1/facility_requirements?id=eq.$I47"
          curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "{\"tenant_id\":\"$TENANT_A\",\"facility_requirement_id\":\"$I47\",\"fact_key\":\"instrument_processing_performed\",\"fact_value\":true}" "$BASE/rest/v1/facility_requirement_facts?on_conflict=facility_requirement_id,fact_key"
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I47\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='NEEDS_ACTION'"
          printf 'instrument-%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > instrument.pdf
          curl -sS --fail-with-body -X POST -H "Origin: $ORIGIN" -H "Authorization: Bearer $OWNERA_TOKEN" -F "requirement_id=$I47" -F 'evidence_type=instrument_processing_record' -F 'file=@instrument.pdf;type=application/pdf' "$BASE/functions/v1/phc-api/upload" >/dev/null
          S=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I47\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          printf '%s' "$S" | python3 -c "import sys,json; assert json.load(sys.stdin)=='REVIEW'"
          echo 'MULTI DOMAIN family PASS'

      - name: Role tenant and production guards
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o viewer.json -w '%{http_code}' -X POST -H "apikey: $KEY" -H "Authorization: Bearer $VIEWERA_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I1\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          test "$CODE" != "200"
          CODE=$(curl -sS -o tenantb.json -w '%{http_code}' -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERB_TOKEN" -H 'Content-Type: application/json' -d "{\"target_requirement\":\"$I1B\"}" "$BASE/rest/v1/rpc/evaluate_requirement")
          test "$CODE" = "400"
          X=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERB_TOKEN" "$BASE/rest/v1/facility_requirements?select=id&id=in.($I1,$I14,$I29,$I32,$I47)")
          printf '%s' "$X" | python3 -c "import sys,json; assert json.load(sys.stdin)==[]"
          R=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/requirement_rule_versions?select=id&release_status=eq.APPROVED_FOR_PRODUCTION")
          printf '%s' "$R" | python3 -c "import sys,json; assert json.load(sys.stdin)==[]"
          echo 'role + tenant + zero-production guards PASS'
