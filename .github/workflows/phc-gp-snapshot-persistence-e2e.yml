name: PHC GP Snapshot Persistence E2E
on:
  push:
    paths:
      - '.github/workflows/phc-gp-snapshot-persistence-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-persistence:
    runs-on: ubuntu-latest
    env:
      BASE: https://auzbkudpqdmrgyxtwaiy.supabase.co
      KEY: sb_publishable_3G6sjO0orxo7FjoS2hUNDw_bbsavIbw
      ORIGIN: https://haqn455-coder.github.io
      TENANT_A: 10000000-0000-0000-0000-000000000001
      TENANT_B: 20000000-0000-0000-0000-000000000002
    steps:
      - name: Obtain fresh synthetic sessions
        shell: bash
        run: |
          set -euo pipefail
          for P in ownerA viewerA ownerB; do
            J=$(curl -sS --fail-with-body -H "Origin: $ORIGIN" "$BASE/functions/v1/phc-api/test-session?persona=$P")
            T=$(printf '%s' "$J" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True; print(d['access_token'])")
            N=$(printf '%s' "$P" | tr '[:lower:]' '[:upper:]')
            echo "${N}_TOKEN=$T" >> "$GITHUB_ENV"
          done
      - name: Owner A inserts privacy-minimum snapshot
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(python3 - <<'PY'
          import json,os
          print(json.dumps({
            'tenant_id':os.environ['TENANT_A'],
            'snapshot_version':'GP_READINESS_SNAPSHOT_V0_1',
            'clinic_name':'CI Snapshot '+os.environ['GITHUB_RUN_ID'],
            'district_city':'Layyah',
            'respondent_role':'Owner-doctor',
            'contact':'03000000000',
            'answers':{'Q01':'CI Snapshot','Q02':'Layyah','Q03':'Owner-doctor','Q04':'03000000000','Q05':'GP','Q07':['Consultation']},
            'triggered_rule_ids':['R01','R02'],
            'lead_status':'SNAPSHOT_CREATED',
            'pilot_status':'WAITLIST_UNTIL_PRODUCTION_PACK'
          }))
          PY
          )
          R=$(curl -sS --fail-with-body -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=representation' -d "$BODY" "$BASE/rest/v1/presales_snapshots")
          ID=$(printf '%s' "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d)==1; x=d[0]; assert set(x['answers']).issubset({'Q01','Q02','Q03','Q04','Q05','Q06','Q07','Q08','Q09','Q10','Q11','Q12','Q13','Q14','Q15','Q16','Q17','Q18','Q19'}); assert len(x['triggered_rule_ids'])<=5; print(x['id'])")
          echo "SNAP_ID=$ID" >> "$GITHUB_ENV"
      - name: Owner A can read own tenant snapshot
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/presales_snapshots?select=id,tenant_id,answers,triggered_rule_ids&id=eq.$SNAP_ID")
          printf '%s' "$R" | python3 -c "import sys,json,os; d=json.load(sys.stdin); assert len(d)==1 and d[0]['tenant_id']==os.environ['TENANT_A']"
      - name: Viewer A cannot read presales snapshots
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $VIEWERA_TOKEN" "$BASE/rest/v1/presales_snapshots?select=id&id=eq.$SNAP_ID")
          printf '%s' "$R" | python3 -c "import sys,json; assert json.load(sys.stdin)==[]"
      - name: Owner B cannot see Tenant A snapshot
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERB_TOKEN" "$BASE/rest/v1/presales_snapshots?select=id&id=eq.$SNAP_ID")
          printf '%s' "$R" | python3 -c "import sys,json; assert json.load(sys.stdin)==[]"
      - name: Owner B cannot insert into Tenant A
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"tenant_id":"'"$TENANT_A"'","snapshot_version":"GP_READINESS_SNAPSHOT_V0_1","clinic_name":"Bad Cross Tenant","district_city":"Layyah","respondent_role":"Owner-doctor","contact":"03000000000","answers":{"Q01":"Bad","Q02":"Layyah","Q03":"Owner-doctor","Q04":"03000000000"},"triggered_rule_ids":[],"lead_status":"SNAPSHOT_CREATED","pilot_status":"WAITLIST_UNTIL_PRODUCTION_PACK"}'
          CODE=$(curl -sS -o cross.json -w '%{http_code}' -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERB_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/rest/v1/presales_snapshots")
          test "$CODE" != "201"
      - name: Invalid answer key is rejected
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"tenant_id":"'"$TENANT_A"'","snapshot_version":"GP_READINESS_SNAPSHOT_V0_1","clinic_name":"Bad Key","district_city":"Layyah","respondent_role":"Owner-doctor","contact":"03000000000","answers":{"Q01":"Bad","Q02":"Layyah","Q03":"Owner-doctor","Q04":"03000000000","PATIENT_NAME":"forbidden"},"triggered_rule_ids":[],"lead_status":"SNAPSHOT_CREATED","pilot_status":"WAITLIST_UNTIL_PRODUCTION_PACK"}'
          CODE=$(curl -sS -o badkey.json -w '%{http_code}' -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/rest/v1/presales_snapshots")
          test "$CODE" = "400"
      - name: More than five rule IDs is rejected
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"tenant_id":"'"$TENANT_A"'","snapshot_version":"GP_READINESS_SNAPSHOT_V0_1","clinic_name":"Too Many","district_city":"Layyah","respondent_role":"Owner-doctor","contact":"03000000000","answers":{"Q01":"Bad","Q02":"Layyah","Q03":"Owner-doctor","Q04":"03000000000"},"triggered_rule_ids":["R01","R02","R03","R04","R05","R06"],"lead_status":"SNAPSHOT_CREATED","pilot_status":"WAITLIST_UNTIL_PRODUCTION_PACK"}'
          CODE=$(curl -sS -o toomany.json -w '%{http_code}' -X POST -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/rest/v1/presales_snapshots")
          test "$CODE" = "400"
      - name: Cleanup synthetic snapshot and assert zero production rules unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SNAP_ID:-}" ]; then
            curl -sS --fail-with-body -X DELETE -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" -H 'Prefer: return=minimal' "$BASE/rest/v1/presales_snapshots?id=eq.$SNAP_ID"
          fi
          P=$(curl -sS --fail-with-body -H "apikey: $KEY" -H "Authorization: Bearer $OWNERA_TOKEN" "$BASE/rest/v1/requirement_rule_versions?select=id&release_status=eq.APPROVED_FOR_PRODUCTION")
          printf '%s' "$P" | python3 -c "import sys,json; assert json.load(sys.stdin)==[]; print('Snapshot persistence RLS E2E PASS; production rules remain zero')"
